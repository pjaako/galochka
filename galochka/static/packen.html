<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="pack.title">galochka</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="pack">
  <nav class="nav">
    <img src="/static/acs_logo.png" alt="ACS" width="32" height="32" class="nav__logo">
    <span class="nav__brand" data-i18n="nav.brand"></span>
    <div class="nav__links">
      <a href="/auftraege" data-i18n="nav.jobs"></a>
    </div>
    <span class="nav__user" id="nav-user"></span>
    <a href="#" id="nav-logout" data-i18n="nav.logout" hidden></a>
  </nav>
  <main class="main">
    <div id="pack-root"></div>
  </main>

  <script src="/static/app.js"></script>
  <script src="/static/lines.js"></script>
  <script>
    (function () {
      var jobId = parseInt(window.location.pathname.split("/").pop(), 10);

      var reportError = C.reportError;

      // Head texts: a delivery shows "order – customer" and the carton; an RMA return "RMA <no> – Rücksendung".
      function headTexts(job) {
        if (job.kind === "rma") {
          return {
            title: C.fmt(C.t("rma.head_outgoing"), { ref: job.order_ref }),
            meta: [job.customer, job.template_name].filter(Boolean).join(" · "),
          };
        }
        var meta = [job.template_name];
        if (job.unit_count > 1) meta.push(C.fmt(C.t("pack.carton"), { n: job.unit_no, total: job.unit_count }));
        return {
          title: job.order_ref + (job.customer ? " – " + job.customer : ""),
          meta: meta.join(" · "),
        };
      }

      async function init() {
        try {
          await C.loadStrings();
        } catch (err) {
          C.toast(C.t("error.generic"));
        }
        var me = await C.loadMe();
        if (!me) {
          C.goLogin();
          return;
        }
        var job;
        try {
          job = await C.api("/api/jobs/" + jobId);
          // The job is packed by whoever opens it: take it over when it is not ours yet.
          var takeOver = (job.kind === "delivery" && (job.status === "open" || job.status === "packing"))
            || (job.kind === "rma" && job.status === "outgoing");
          if (takeOver && job.claimed_by !== me.id) {
            // Opening the link must not silently take a colleague's job away.
            if (job.claimed_by && !window.confirm(C.fmt(C.t("jobs.claim_confirm"), { name: job.claimed_by_name || "" }))) {
              window.location.href = "/auftraege";
              return;
            }
            try {
              await C.api("/api/jobs/" + jobId + "/claim", { method: "POST" });
              job = await C.api("/api/jobs/" + jobId);
            } catch (err) {
              reportError(err);
            }
          }
        } catch (err) {
          reportError(err);
          return;
        }
        if (job.kind === "rma" && job.status !== "outgoing" && job.status !== "packed" && job.status !== "checked" && job.status !== "shipped") {
          window.location.href = "/rma/" + job.id;
          return;
        }
        var head = headTexts(job);
        var options = {
          editable: job.status === "packing" || (job.kind === "rma" && job.status === "outgoing"),
          title: head.title,
          meta: head.meta,
        };
        if (job.kind === "rma") {
          options.keys = { done_check: "pack.rma_done_second_check", done_released: "pack.rma_done_released" };
        }
        Lines.mount(document.getElementById("pack-root"), job, options);
      }
      init();
    })();
  </script>
</body>
</html>
