<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="print.title">galochka</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="print">
  <nav class="nav">
    <img src="/static/acs_logo.png" alt="ACS" width="32" height="32" class="nav__logo">
    <span class="nav__brand" data-i18n="nav.brand"></span>
    <div class="nav__links">
      <a href="/auftraege" data-i18n="nav.jobs"></a>
    </div>
    <span class="nav__user" id="nav-user"></span>
    <a href="#" id="nav-logout" data-i18n="nav.logout" hidden></a>
  </nav>
  <main class="main">
    <h1 class="no-print" data-i18n="print.title"></h1>

    <!-- Login form of both branches: opened from the office PC with the expert password. -->
    <form id="login-form" class="login-form no-print" hidden>
      <p class="field__help" id="password-hint" data-i18n="print.password_hint"></p>
      <input type="password" id="password-input" class="input-id" data-i18n-placeholder="expert.password_placeholder"
        autocomplete="off">
      <button type="submit" class="btn btn--primary" data-i18n="expert.login"></button>
    </form>

    <p id="error-note" class="note no-print" role="alert" hidden></p>

    <!-- Box label: /druck/etikett/<job_id> (delivery and RMA). -->
    <div id="label-view" hidden>
      <p id="label-warning" class="note no-print" hidden></p>
      <div class="print-label print-label--box" id="label-box">
        <div class="box-label__text" id="label-text"></div>
        <img id="label-qr" class="box-label__qr" alt="">
      </div>
      <div class="form-actions no-print">
        <button type="button" id="label-print-btn" class="btn btn--primary" data-i18n="print.button"></button>
      </div>
    </div>

    <!-- Badge: /druck/badge/<worker_id>. -->
    <div id="badge-view" hidden>
      <div class="print-label print-label--badge">
        <img id="badge-qr" class="badge-label__qr" alt="">
        <div class="badge-label__text">
          <div id="badge-name" class="badge-label__name"></div>
          <div id="badge-code" class="badge-label__code"></div>
        </div>
      </div>
      <div class="form-actions no-print">
        <button type="button" id="print-btn" class="btn btn--primary" data-i18n="print.button"></button>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    (function () {
      var loginForm = document.getElementById("login-form");
      var passwordInput = document.getElementById("password-input");
      var errorNote = document.getElementById("error-note");
      var badgeView = document.getElementById("badge-view");
      var qrImg = document.getElementById("badge-qr");
      var objectUrl = null;
      var labelView = document.getElementById("label-view");
      var labelText = document.getElementById("label-text");
      var labelQr = document.getElementById("label-qr");
      var labelWarning = document.getElementById("label-warning");

      var parts = window.location.pathname.split("/");
      var kind = parts[2];
      var targetId = parseInt(parts[3], 10);

      function showError(key) {
        badgeView.hidden = true;
        labelView.hidden = true;
        errorNote.textContent = C.t(key);
        errorNote.hidden = false;
      }

      function showLogin() {
        badgeView.hidden = true;
        labelView.hidden = true;
        errorNote.hidden = true;
        loginForm.hidden = false;
      }

      async function showBadge() {
        errorNote.hidden = true;
        var workers;
        var svg;
        try {
          workers = await C.expertApi("/api/expert/workers");
          var worker = null;
          workers.forEach(function (w) {
            if (w.id === targetId) worker = w;
          });
          if (!worker) {
            showError("print.worker_unknown");
            return;
          }
          if (!worker.badge) {
            showError("print.no_badge");
            return;
          }
          svg = await C.expertApi("/api/expert/workers/" + targetId + "/badge.svg", { blob: true });
          document.getElementById("badge-name").textContent = worker.name;
          document.getElementById("badge-code").textContent = worker.badge.short_code;
        } catch (err) {
          if (err && err.status === 401) {
            showLogin(); // expertApi already cleared the password and toasted
          } else if (err && err.status === 404) {
            showError("print.no_badge");
          } else {
            C.toast((err && err.detail) || C.t("error.generic"));
          }
          return;
        }
        loginForm.hidden = true;
        // A blob URL keeps the token off the address bar and out of history.
        if (objectUrl) URL.revokeObjectURL(objectUrl);
        objectUrl = URL.createObjectURL(svg);
        qrImg.src = objectUrl;
        qrImg.alt = C.t("print.badge_alt");
        badgeView.hidden = false;
      }


      // --- box label (/druck/etikett/<job_id>) -----------------------------------------------------

      function two(n) {
        return n < 10 ? "0" + n : String(n);
      }

      // ISO timestamp -> dd.mm.yyyy in the browser's time zone.
      function formatDate(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        return two(d.getDate()) + "." + two(d.getMonth() + 1) + "." + d.getFullYear();
      }

      function labelLine(text, strong) {
        var line = document.createElement("div");
        line.className = "box-label__line" + (strong ? " box-label__line--strong" : "");
        line.textContent = text;
        labelText.appendChild(line);
        return line;
      }

      function renderLabel(data) {
        while (labelText.firstChild) labelText.removeChild(labelText.firstChild);
        var rma = data.kind === "rma";
        var order = document.createElement("div");
        order.className = "box-label__order";
        order.id = "label-order";
        order.textContent = rma ? C.fmt(C.t("label.rma"), { ref: data.order_ref }) : data.order_ref;
        labelText.appendChild(order);
        if (data.customer) labelLine(data.customer, true);
        if (data.template_name) labelLine(data.template_name, false);
        if (!rma) {
          if (data.unit_count > 1) {
            labelLine(C.fmt(C.t("label.carton"), { n: data.unit_no, total: data.unit_count }), true);
          }
          if (data.packed_by && data.packed_by.length) {
            labelLine(C.fmt(C.t("label.packed"), { names: data.packed_by.join(", ") }), false);
          }
          // A label for a box that is not released yet (expert opens it early) states nothing about the check.
          if (data.status === "checked" || data.status === "shipped") {
            labelLine(
              data.checked_by
                ? C.fmt(C.t("label.checked"), { name: data.checked_by, date: formatDate(data.checked_at) })
                : C.t("label.unchecked"),
              false
            );
          }
        }
        labelWarning.hidden = data.status === "checked" || data.status === "shipped" || rma;
        if (!labelWarning.hidden) labelWarning.textContent = C.fmt(C.t("label.not_final"), { status: C.t("status." + data.status) });
        // Unauthenticated endpoint: no token needed for the <img>.
        labelQr.alt = C.t("label.qr_alt");
        labelQr.src = "/api/jobs/" + targetId + "/qr.svg";
        labelView.hidden = false;
      }

      // Worker session first (noRedirect: a 401 is ours to handle), then the expert password.
      async function fetchLabel() {
        var path = "/api/jobs/" + targetId + "/label";
        try {
          return await C.api(path, { noRedirect: true });
        } catch (err) {
          if (!err || err.status !== 401) throw err;
        }
        if (!C.getExpertPassword()) {
          var needLogin = { status: 401, needLogin: true };
          throw needLogin;
        }
        return C.expertApi(path);
      }

      async function showLabel() {
        errorNote.hidden = true;
        var data;
        try {
          data = await fetchLabel();
        } catch (err) {
          if (err && err.status === 401) {
            showLogin(); // no password stored, or expertApi cleared a wrong one and toasted
          } else if (err && err.status === 404) {
            showError("label.unknown_job");
          } else {
            C.toast((err && err.detail) || C.t("error.generic"));
          }
          return;
        }
        loginForm.hidden = true;
        renderLabel(data);
      }

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        C.setExpertPassword(passwordInput.value);
        passwordInput.value = "";
        if (kind === "etikett") showLabel(); else showBadge();
      });

      document.getElementById("print-btn").addEventListener("click", function () {
        window.print();
      });
      document.getElementById("label-print-btn").addEventListener("click", function () {
        window.print();
      });

      async function init() {
        try {
          await C.loadStrings();
        } catch (err) {
          C.toast(C.t("error.generic"));
        }
        if (kind === "badge") {
          if (C.getExpertPassword()) {
            await showBadge();
          } else {
            showLogin();
          }
        } else {
          document.getElementById("password-hint").textContent = C.t("label.password_hint");
          await showLabel();
        }
      }
      init();
    })();
  </script>
</body>
</html>
