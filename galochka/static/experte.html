      });

      // --- Artikelsuche (Vorlagen-Editor and BOM-Import) ----------------------------------
      var clearNode = C.clearNode;

      // Text input with a small dropdown fed by GET /api/items?q= (C.itemPicker, authenticated with the
      // expert password). `initial` is {id, name} or null. The chosen item id is only set by picking from
      // the list; editing the text clears it.
      function makeItemPicker(initial, labelKey) {
        return C.itemPicker({
          initial: initial,
          fetch: expertApi,
          label: C.t(labelKey || "expert.tpl_line_item"),
        });
      }

      // --- Vorlagen ----------------------------------------------------------------------
      var tplListView = document.getElementById("tpl-list-view");
      var tplList = document.getElementById("tpl-list");
      var tplEmpty = document.getElementById("tpl-empty");
      var tplNewBtn = document.getElementById("tpl-new-btn");
      var tplEditor = document.getElementById("tpl-editor");
      var tplEditorTitle = document.getElementById("tpl-editor-title");
      var tplNameInput = document.getElementById("tpl-name");
      var tplProduct = document.getElementById("tpl-product");
      var tplSecondCheck = document.getElementById("tpl-second-check");
      var tplLines = document.getElementById("tpl-lines");
      var tplAddLine = document.getElementById("tpl-add-line");
      var tplSaveBtn = document.getElementById("tpl-save-btn");
      var tplCancelBtn = document.getElementById("tpl-cancel-btn");
      var tplEditingId = null;
      var tplEditingActive = true;
      var tplProductPicker = null;
      var templatesCache = [];

      function secondCheckValue() {
        if (tplSecondCheck.value === "1") return true;
        if (tplSecondCheck.value === "0") return false;
        return null;
      }

      function tplButton(labelKey, onClick) {
        return workerButton(labelKey, onClick);
      }

      function renderTemplateRow(tpl) {
        var row = document.createElement("div");
        row.className = "worker-row" + (tpl.active ? "" : " worker-row--inactive");

        var info = document.createElement("div");
        info.className = "worker-row__info";
        var name = document.createElement("div");
        name.className = "worker-row__name";
        name.textContent = tpl.name;
        info.appendChild(name);
        var meta = document.createElement("div");
        meta.className = "worker-row__meta";
        var parts = [];
        if (tpl.product_item_id) {
          parts.push(C.fmt(C.t("expert.tpl_meta_product"), { product: itemLabel(tpl.product_item_id, tpl.product_name) }));
        }
        parts.push(C.fmt(C.t("expert.tpl_meta_lines"), { count: tpl.line_count }));
        if (!tpl.active) parts.push(C.t("expert.tpl_inactive"));
        meta.textContent = parts.join(" · ");
        info.appendChild(meta);
        row.appendChild(info);

        var actions = document.createElement("div");
        actions.className = "worker-row__actions";
        actions.appendChild(tplButton("expert.tpl_edit", function () { editTemplate(tpl.id); }));
        actions.appendChild(tplButton("expert.tpl_duplicate", function () { duplicateTemplate(tpl); }));
        actions.appendChild(
          tplButton(tpl.active ? "expert.tpl_deactivate" : "expert.tpl_activate", function () {
            setTemplateActive(tpl, !tpl.active);
          })
        );
        actions.appendChild(tplButton("expert.tpl_delete", function () { deleteTemplate(tpl); }));
        row.appendChild(actions);
        return row;
      }

      async function refreshTemplates() {
        try {
          templatesCache = await expertApi("/api/expert/templates?all=1");
        } catch (err) {
          reportError(err);
          return;
        }
        clearNode(tplList);
        templatesCache.forEach(function (tpl) {
          tplList.appendChild(renderTemplateRow(tpl));
        });
        tplEmpty.hidden = templatesCache.length > 0;
      }

      function templateBody(tpl, active) {
        return {
          name: tpl.name,
          product_item_id: tpl.product_item_id,
          active: active,
          second_check: tpl.second_check,
          lines: tpl.lines.map(function (line) {
            return {
              id: line.id,
              item_id: line.item_id,
              label: line.label,
              instruction: line.instruction,
              qty: line.qty,
              photo_required: line.photo_required,
              serial_required: line.serial_required,
              quality_points: line.quality_points,
              photo_item_id: line.photo_item_id,
            };
          }),
        };
      }

      async function setTemplateActive(tpl, active) {
        try {
          var full = await expertApi("/api/expert/templates/" + tpl.id);
          await expertApi("/api/expert/templates/" + tpl.id, { method: "PUT", body: templateBody(full, active) });
        } catch (err) {
          reportError(err);
        }
        await refreshTemplates();
      }

      async function duplicateTemplate(tpl) {
        try {
          await expertApi("/api/expert/templates/" + tpl.id + "/duplicate", { method: "POST" });
          C.toast(C.t("expert.tpl_duplicated"));
        } catch (err) {
          reportError(err);
        }
        await refreshTemplates();
      }

      async function deleteTemplate(tpl) {
        if (!window.confirm(C.fmt(C.t("expert.tpl_delete_confirm"), { name: tpl.name }))) return;
        try {
          await expertApi("/api/expert/templates/" + tpl.id, { method: "DELETE" });
          C.toast(C.t("expert.tpl_deleted"));
        } catch (err) {
          reportError(err); // 409: the template is used by jobs
        }
        await refreshTemplates();
      }

      function renumberLines() {
        var rows = tplLines.children;
        for (var i = 0; i < rows.length; i++) {
          rows[i]._line.number.textContent = String(i + 1);
        }
      }

      function lineLabelled(labelKey, control) {
        var wrap = document.createElement("label");
        wrap.className = "field";
        var span = document.createElement("span");
        span.className = "field__label";
        span.textContent = C.t(labelKey);
        wrap.appendChild(span);
        wrap.appendChild(control);
        return wrap;
      }

      function lineCheckbox(labelKey, checked) {
        var wrap = document.createElement("label");
        wrap.className = "field__checkbox-row";
        var box = document.createElement("input");
        box.type = "checkbox";
        box.checked = checked;
        var span = document.createElement("span");
        span.textContent = C.t(labelKey);
        wrap.appendChild(box);
        wrap.appendChild(span);
        return { el: wrap, box: box };
      }

      function lineIconButton(text, titleKey, onClick) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn--secondary tpl-line__btn";
        btn.textContent = text;
        btn.title = C.t(titleKey);
        btn.setAttribute("aria-label", C.t(titleKey));
        btn.addEventListener("click", onClick);
        return btn;
      }

      function textInput(value, maxLength) {
        var input = document.createElement("input");
        input.type = "text";
        input.className = "input-id";
        input.maxLength = maxLength;
        input.setAttribute("autocomplete", "off");
        input.value = value || "";
        return input;
      }

      // Append one editable line to the editor. `line` is a template line from the API or null.
      function addLineRow(line) {
        line = line || {};
        var row = document.createElement("div");
        row.className = "tpl-line";

        var head = document.createElement("div");
        head.className = "tpl-line__head";
        var number = document.createElement("span");
        number.className = "tpl-line__no";
        head.appendChild(number);
        head.appendChild(
          lineIconButton("↑", "expert.tpl_line_up", function () {
            var prev = row.previousElementSibling;
            if (prev) tplLines.insertBefore(row, prev);
            renumberLines();
          })
        );
        head.appendChild(
          lineIconButton("↓", "expert.tpl_line_down", function () {
            var next = row.nextElementSibling;
            if (next) tplLines.insertBefore(next, row);
            renumberLines();
          })
        );
        head.appendChild(
          lineIconButton("✕", "expert.tpl_line_remove", function () {
            tplLines.removeChild(row);
            renumberLines();
          })
        );
        row.appendChild(head);

        var picker = makeItemPicker(line.item_id ? { id: line.item_id, name: line.item_name } : null);
        var itemField = document.createElement("div");
        itemField.className = "field";
        var itemLab = document.createElement("span");
        itemLab.className = "field__label";
        itemLab.textContent = C.t("expert.tpl_line_item");
        itemField.appendChild(itemLab);
        itemField.appendChild(picker.el);
        row.appendChild(itemField);

        var labelInput = textInput(line.label, 120);
        row.appendChild(lineLabelled("expert.tpl_line_label", labelInput));
        var instrInput = textInput(line.instruction, 500);
        row.appendChild(lineLabelled("expert.tpl_line_instruction", instrInput));

        var qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.className = "select";
        qtyInput.min = "1";
        qtyInput.max = "999";
        qtyInput.step = "1";
        qtyInput.value = String(line.qty || 1);
        row.appendChild(lineLabelled("expert.tpl_line_qty", qtyInput));

        var photo = lineCheckbox("expert.tpl_line_photo", line.photo_required !== false);
        var serial = lineCheckbox("expert.tpl_line_serial", !!line.serial_required);
        row.appendChild(photo.el);
        row.appendChild(serial.el);

        var pointsInput = textInput((line.quality_points || []).join(", "), 700);
        row.appendChild(lineLabelled("expert.tpl_line_points", pointsInput));

        row._line = {
          id: line.id === undefined ? null : line.id,
          photoItemId: line.photo_item_id || null,
          number: number,
          picker: picker,
          labelInput: labelInput,
          instrInput: instrInput,
          qtyInput: qtyInput,
          photo: photo.box,
          serial: serial.box,
          pointsInput: pointsInput,
        };
        tplLines.appendChild(row);
        renumberLines();
        return row;
      }

      // Read the editor into a request body, or toast the problem and return null.
      function collectTemplate() {
        var name = tplNameInput.value.trim();
        if (!name) {
          C.toast(C.t("expert.tpl_name_required"));
          return null;
        }
        if (!tplProductPicker.isValid()) {
          C.toast(C.t("expert.tpl_item_pick"));
          return null;
        }
        var lines = [];
        var rows = tplLines.children;
        for (var i = 0; i < rows.length; i++) {
          var st = rows[i]._line;
          if (!st.picker.isValid()) {
            C.toast(C.t("expert.tpl_item_pick"));
            return null;
          }
          var itemId = st.picker.getId();
          var label = st.labelInput.value.trim();
          if (!label && !itemId) {
            C.toast(C.t("expert.tpl_label_required"));
            return null;
          }
          var qtyText = st.qtyInput.value.trim();
          var qty = /^\d+$/.test(qtyText) ? parseInt(qtyText, 10) : 0;
          if (qty < 1 || qty > 999) {
            C.toast(C.t("expert.tpl_qty_invalid"));
            return null;
          }
          var points = st.pointsInput.value
            .split(",")
            .map(function (p) { return p.trim(); })
            .filter(function (p) { return p !== ""; });
          var tooLong = points.some(function (p) { return p.length > 60; });
          if (points.length > 10 || tooLong || points.filter(function (p, k) { return points.indexOf(p) !== k; }).length) {
            C.toast(C.t("expert.tpl_points_invalid"));
            return null;
          }
          lines.push({
            id: st.id,
            item_id: itemId,
            label: label,
            instruction: st.instrInput.value.trim(),
            qty: qty,
            photo_required: st.photo.checked,
            serial_required: st.serial.checked,
            quality_points: points,
            photo_item_id: st.photoItemId,
          });
        }
        return {
          name: name,
          product_item_id: tplProductPicker.getId(),
          second_check: secondCheckValue(),
          lines: lines,
        };
      }

      // template = full template from the API, or null for a new one.
      function openEditor(template) {
        tplEditingId = template ? template.id : null;
        tplEditingActive = template ? template.active : true;
        tplEditorTitle.textContent = C.t(template ? "expert.tpl_editor_edit" : "expert.tpl_editor_new");
        tplNameInput.value = template ? template.name : "";
        clearNode(tplProduct);
        tplProductPicker = makeItemPicker(
          template && template.product_item_id ? { id: template.product_item_id, name: template.product_name } : null,
          "expert.tpl_product"
        );
        tplProduct.appendChild(tplProductPicker.el);
        tplSecondCheck.value = template && template.second_check !== null ? (template.second_check ? "1" : "0") : "";
        clearNode(tplLines);
        (template ? template.lines : []).forEach(function (line) { addLineRow(line); });
        tplListView.hidden = true;
        tplEditor.hidden = false;
        if (tplEditor.scrollIntoView) tplEditor.scrollIntoView();
      }

      function closeEditor() {
        tplEditor.hidden = true;
        tplListView.hidden = false;
        tplEditingId = null;
      }

      async function editTemplate(id) {
        try {
          openEditor(await expertApi("/api/expert/templates/" + id));
        } catch (err) {
          reportError(err);
        }
      }

      tplNewBtn.addEventListener("click", function () { openEditor(null); });
      tplAddLine.addEventListener("click", function () {
        var row = addLineRow(null);
        row._line.picker.el.querySelector("input").focus();
      });
      tplCancelBtn.addEventListener("click", closeEditor);
      tplEditor.addEventListener("submit", async function (event) {
        event.preventDefault();
        var body = collectTemplate();
        if (!body) return;
        tplSaveBtn.disabled = true;
        try {
          if (tplEditingId === null) {
            await expertApi("/api/expert/templates", { body: body });
          } else {
            body.active = tplEditingActive;
            await expertApi("/api/expert/templates/" + tplEditingId, { method: "PUT", body: body });
          }
          C.toast(C.t("expert.tpl_saved"));
          closeEditor();
          await refreshTemplates();
        } catch (err) {
          reportError(err);
        }
        tplSaveBtn.disabled = false;
      });

      // --- BOM-Import (Artikel tab) ------------------------------------------------------
      var bomForm = document.getElementById("bom-form");
      var bomFile = document.getElementById("bom-file");
      var bomPreviewBtn = document.getElementById("bom-preview-btn");
      var bomPreview = document.getElementById("bom-preview");
      var bomSummary = document.getElementById("bom-summary");
      var bomNameInput = document.getElementById("bom-name");
      var bomProduct = document.getElementById("bom-product");
      var bomModeNew = document.getElementById("bom-mode-new");
      var bomModeReplace = document.getElementById("bom-mode-replace");
      var bomModeReplaceRow = document.getElementById("bom-mode-replace-row");
      var bomModeReplaceText = document.getElementById("bom-mode-replace-text");
      var bomZeroRow = document.getElementById("bom-zero-row");
      var bomZero = document.getElementById("bom-zero");
      var bomUnknown = document.getElementById("bom-unknown");
      var bomLines = document.getElementById("bom-lines");
      var bomImportBtn = document.getElementById("bom-import-btn");
      var bomData = null;
      var bomProductPicker = null;

      function bomFormData(dry) {
        var file = bomFile.files && bomFile.files[0];
        var formData = new FormData();
        formData.append("file", file, file.name);
        formData.append("dry_run", dry ? "1" : "0");
        formData.append("include_zero_qty", bomZero.checked ? "1" : "0");
        return formData;
      }

      function bomCell(row, text, className) {
        var td = document.createElement("td");
        if (className) td.className = className;
        td.textContent = text;
        row.appendChild(td);
        return td;
      }

      function renderBomLines(lines) {
        clearNode(bomLines);
        var table = document.createElement("table");
        table.className = "bom-table";
        var headRow = document.createElement("tr");
        ["expert.bom_col_pos", "expert.bom_col_item", "expert.bom_col_name", "expert.bom_col_qty", "expert.bom_col_known"]
          .forEach(function (key) {
            var th = document.createElement("th");
            th.textContent = C.t(key);
            headRow.appendChild(th);
          });
        table.appendChild(headRow);
        lines.forEach(function (line) {
          var tr = document.createElement("tr");
          if (line.skipped_zero_qty) tr.className = "bom-row--skipped";
          bomCell(tr, String(line.position));
          bomCell(tr, line.item_id, "bom-table__id");
          var text = line.item_name || line.label;
          if (line.version) text += " · " + line.version;
          if (line.skipped_zero_qty) text += " – " + C.t("expert.bom_skipped");
          bomCell(tr, text);
          bomCell(tr, String(line.qty));
          bomCell(tr, line.known ? "✓" : "✗");
          table.appendChild(tr);
        });
        bomLines.appendChild(table);
      }

      // keep = true: a re-preview (zero-quantity box) must not overwrite what the expert typed.
      function renderBomPreview(data, keep) {
        bomData = data;
        var product = data.product_item_id
          ? itemLabel(data.product_item_id, data.product_name) +
            (data.product_known ? "" : " (" + C.t("expert.bom_product_unknown") + ")")
          : "–";
        bomSummary.textContent = C.fmt(C.t("expert.bom_summary"), {
          bom_number: data.bom_number,
          bom_name: data.bom_name,
          product: product,
        });
        if (!keep) {
          bomNameInput.value = data.bom_name || data.bom_number;
          clearNode(bomProduct);
          bomProductPicker = makeItemPicker(
            data.product_known ? { id: data.product_item_id, name: data.product_name } : null,
            "expert.bom_product"
          );
          bomProduct.appendChild(bomProductPicker.el);
          bomModeNew.checked = true;
        }
        if (data.existing_template_id) {
          var existing = templatesCache.filter(function (tpl) { return tpl.id === data.existing_template_id; })[0];
          bomModeReplaceText.textContent = C.fmt(C.t("expert.bom_mode_replace"), {
            name: existing ? existing.name : "#" + data.existing_template_id,
          });
          bomModeReplaceRow.hidden = false;
        } else {
          bomModeReplaceRow.hidden = true;
          bomModeNew.checked = true;
        }
        bomZeroRow.hidden = !data.lines.some(function (line) { return line.qty === 0; });
        if (data.unknown_items.length) {
          bomUnknown.textContent = C.fmt(C.t("expert.bom_unknown"), {
            count: data.unknown_items.length,
            items: data.unknown_items.join(", "),
          });
          bomUnknown.hidden = false;
        } else {
          bomUnknown.hidden = true;
        }
        renderBomLines(data.lines);
        bomPreview.hidden = false;
      }

      async function runBomPreview(keep) {
        var file = bomFile.files && bomFile.files[0];
        if (!file) {
          C.toast(C.t("expert.bom_none"));
          return;
        }
        bomPreviewBtn.disabled = true;
        try {
          renderBomPreview(await expertApi("/api/expert/import/bom", { formData: bomFormData(true) }), keep);
        } catch (err) {
          bomPreview.hidden = true;
          bomData = null;
          reportError(err);
        }
        bomPreviewBtn.disabled = false;
      }

      bomForm.addEventListener("submit", function (event) {
        event.preventDefault();
        runBomPreview(false);
      });
      bomZero.addEventListener("change", function () { runBomPreview(true); });

      bomImportBtn.addEventListener("click", async function () {
        if (!bomData) return;
        if (!bomProductPicker.isValid()) {
          C.toast(C.t("expert.tpl_item_pick"));
          return;
        }
        var formData = bomFormData(false);
        formData.append("name", bomNameInput.value.trim());
        formData.append("product_item_id", bomProductPicker.getId() || "");
        var replace = bomModeReplace.checked && bomData.existing_template_id;
        formData.append("mode", replace ? "replace:" + bomData.existing_template_id : "new");
        bomImportBtn.disabled = true;
        try {
          var result = await expertApi("/api/expert/import/bom", { formData: formData });
          var count = result.lines.filter(function (line) { return !line.skipped_zero_qty; }).length;
          C.toast(C.fmt(C.t("expert.bom_imported"), { count: count }));
          bomPreview.hidden = true;
          bomData = null;
          bomFile.value = "";
          bomZero.checked = false;
          switchTab("vorlagen");
          await refreshTemplates();
          await editTemplate(result.template_id);
        } catch (err) {
          reportError(err);
        }
        bomImportBtn.disabled = false;
      });

      // --- Aufträge -----------------------------------------------------------------------
      var JOB_STATUS_ORDER = ["open", "packing", "packed", "checked", "shipped", "cancelled", "intake", "repair", "outgoing"];
      var jobForm = document.getElementById("job-form");
      var jobKind = document.getElementById("job-kind");
      var jobOrderLabel = document.getElementById("job-order-label");
      var jobCountField = document.getElementById("job-count-field");
      var jobRmaHelp = document.getElementById("job-rma-help");
      var jobTemplate = document.getElementById("job-template");
      var jobOrder = document.getElementById("job-order");
      var jobCustomer = document.getElementById("job-customer");
      var jobCount = document.getElementById("job-count");
      var jobNote = document.getElementById("job-note");
      var jobCustom = document.getElementById("job-custom");
      var jobLines = document.getElementById("job-lines");
      var jobExtras = document.getElementById("job-extras");
      var jobExtraAdd = document.getElementById("job-extra-add");
      var jobCreateBtn = document.getElementById("job-create-btn");
      var jobFilter = document.getElementById("job-filter");
      var jobRows = document.getElementById("job-rows");
      var jobEmpty = document.getElementById("job-empty");
      var jobLineControls = []; // [{line, omit, reason}] for the loaded template
      var jobExtraControls = []; // [{wrap, picker, label, qty, reason}]

      function fillJobFilter() {
        clearNode(jobFilter);
        var all = document.createElement("option");
        all.value = "";
        all.textContent = C.t("expert.jobs_filter_active");
        jobFilter.appendChild(all);
        JOB_STATUS_ORDER.forEach(function (status) {
          var option = document.createElement("option");
          option.value = status;
          option.textContent = C.t("status." + status);
          jobFilter.appendChild(option);
        });
      }

      async function refreshJobTemplates() {
        var chosen = jobTemplate.value;
        var templates;
        try {
          templates = await expertApi("/api/expert/templates");
        } catch (err) {
          reportError(err);
          return;
        }
        clearNode(jobTemplate);
        var blank = document.createElement("option");
        blank.value = "";
        blank.textContent = C.t("expert.job_template_choose");
        jobTemplate.appendChild(blank);
        templates.forEach(function (tpl) {
          var option = document.createElement("option");
          option.value = String(tpl.id);
          option.textContent = tpl.name;
          jobTemplate.appendChild(option);
        });
        jobTemplate.value = chosen;
        if (jobTemplate.value !== chosen) await loadJobCustomisation();
      }

      // Input with a placeholder and a visually hidden <label> (appended to `parent`) for screen readers.
      function jobLabeledInput(placeholderKey, type, parent) {
        var input = document.createElement("input");
        input.type = type || "text";
        input.className = "input-id";
        input.setAttribute("autocomplete", "off");
        input.setAttribute("placeholder", C.t(placeholderKey));
        parent.appendChild(C.hiddenLabel(input, C.t(placeholderKey)));
        return input;
      }

      // Lines of the chosen template: a "weglassen" checkbox and a reason field each.
      async function loadJobCustomisation() {
        clearNode(jobLines);
        clearNode(jobExtras);
        jobLineControls = [];
        jobExtraControls = [];
        var templateId = parseInt(jobTemplate.value, 10);
        jobCustom.hidden = !templateId;
        if (!templateId) return;
        var template;
        try {
          template = await expertApi("/api/expert/templates/" + templateId);
        } catch (err) {
          reportError(err);
          return;
        }
        template.lines.forEach(function (line) {
          var row = document.createElement("div");
          row.className = "tpl-line";
          row.setAttribute("data-template-line", String(line.id));
          var head = document.createElement("label");
          head.className = "field__checkbox-row";
          var omit = document.createElement("input");
          omit.type = "checkbox";
          var text = document.createElement("span");
          text.textContent = line.qty + " × " + line.label + " – " + C.t("expert.job_omit");
          head.appendChild(omit);
          head.appendChild(text);
          var reason = jobLabeledInput("expert.job_omit_reason", "text", row);
          reason.maxLength = 200;
          reason.hidden = true;
          omit.addEventListener("change", function () { reason.hidden = !omit.checked; });
          row.appendChild(head);
          row.appendChild(reason);
          jobLines.appendChild(row);
          jobLineControls.push({ line: line, omit: omit, reason: reason });
        });
      }

      function addJobExtra() {
        var wrap = document.createElement("div");
        wrap.className = "tpl-line";
        var picker = makeItemPicker(null, "pack.extra_item");
        var label = jobLabeledInput("expert.job_extra_label", "text", wrap);
        label.maxLength = 120;
        var qty = jobLabeledInput("expert.job_extra_qty", "number", wrap);
        qty.min = "1";
        qty.max = "999";
        qty.value = "1";
        var reason = jobLabeledInput("expert.job_extra_reason", "text", wrap);
        reason.maxLength = 200;
        var remove = workerButton("expert.job_extra_remove", function () {
          jobExtras.removeChild(wrap);
          jobExtraControls = jobExtraControls.filter(function (c) { return c.wrap !== wrap; });
        });
        [picker.el, label, qty, reason, remove].forEach(function (node) {
          node.style.marginTop = "8px";
          wrap.appendChild(node);
        });
        jobExtras.appendChild(wrap);
        jobExtraControls.push({ wrap: wrap, picker: picker, label: label, qty: qty, reason: reason });
      }

      // Returns {customisations} or {error: text}.
      function collectCustomisations() {
        var out = [];
        for (var i = 0; i < jobLineControls.length; i += 1) {
          var c = jobLineControls[i];
          if (!c.omit.checked) continue;
          var why = c.reason.value.trim();
          if (why.length < 3) return { error: C.t("expert.job_reason_required") };
          out.push({ template_line_id: c.line.id, withheld: true, reason: why });
        }
        for (var j = 0; j < jobExtraControls.length; j += 1) {
          var x = jobExtraControls[j];
          if (!x.picker.isValid()) return { error: C.t("expert.tpl_item_pick") };
          var itemId = x.picker.getId();
          var label = x.label.value.trim();
          var qty = parseInt(x.qty.value, 10);
          var reason = x.reason.value.trim();
          if ((!label && !itemId) || !(qty >= 1 && qty <= 999)) return { error: C.t("expert.job_extra_invalid") };
          if (reason.length < 3) return { error: C.t("expert.job_reason_required") };
          var extra = { qty: qty, reason: reason };
          if (itemId) extra.item_id = itemId;
          if (label) extra.label = label;
          out.push(extra);
        }
        return { customisations: out };
      }

      function jobCell(row, text) {
        var td = document.createElement("td");
        td.textContent = text;
        row.appendChild(td);
        return td;
      }

      // Status the expert can send a finished or cancelled job back to (null = no reopen).
      function reopenTarget(job) {
        if (job.status === "cancelled") return job.kind === "rma" ? "intake" : "open";
        if (job.status === "packed" || job.status === "checked" || job.status === "shipped") {
          return job.kind === "rma" ? "outgoing" : "packing";
        }
        return null;
      }

      async function patchJob(job, status, doneKey) {
        try {
          await expertApi("/api/expert/jobs/" + job.id, { method: "PATCH", body: { status: status } });
          C.toast(C.t(doneKey));
        } catch (err) {
          reportError(err);
        }
        await refreshJobs();
      }

      function jobActionButton(labelKey, onClick) {
        var btn = workerButton(labelKey, onClick);
        return btn;
      }

      function renderJobRow(job) {
        var row = document.createElement("tr");
        row.setAttribute("data-job-id", String(job.id));
        jobCell(row, job.order_ref + (job.customer ? " – " + job.customer : ""));
        jobCell(row, job.template_name);
        jobCell(row, job.unit_count > 1 ? C.fmt(C.t("jobs.carton"), { n: job.unit_no, total: job.unit_count }) : "–");
        jobCell(row, C.t("status." + job.status));
        jobCell(row, job.claimed_by_name || "–");
        jobCell(row, C.fmt(C.t("jobs.progress"), { done: job.lines_done, total: job.lines_total }));
        var actions = document.createElement("td");
        if (job.status !== "shipped" && job.status !== "cancelled") {
          actions.appendChild(jobActionButton("expert.job_cancel", function () {
            if (!window.confirm(C.fmt(C.t("expert.job_cancel_confirm"), { order: job.order_ref }))) return;
            patchJob(job, "cancelled", "expert.job_cancelled");
          }));
        }
        var target = reopenTarget(job);
        if (target) {
          actions.appendChild(jobActionButton("expert.job_reopen", function () {
            if (!window.confirm(C.fmt(C.t("expert.job_reopen_confirm"), { order: job.order_ref }))) return;
            patchJob(job, target, "expert.job_reopened");
          }));
        }
        var label = document.createElement("a");
        label.className = "btn btn--secondary";
        label.href = "/druck/etikett/" + job.id;
        label.target = "_blank";
        label.rel = "opener"; // same origin: the label tab inherits the expert password
        label.textContent = C.t("expert.job_label");
        actions.appendChild(label);
        row.appendChild(actions);
        return row;
      }

      async function refreshJobs() {
        var query = jobFilter.value ? "?status=" + encodeURIComponent(jobFilter.value) : "";
        var jobs;
        try {
          jobs = await expertApi("/api/expert/jobs" + query);
        } catch (err) {
          reportError(err);
          return;
        }
        clearNode(jobRows);
        jobs.forEach(function (job) { jobRows.appendChild(renderJobRow(job)); });
        jobEmpty.hidden = jobs.length > 0;
      }

      // An RMA is always one carton and is identified by the RMA number from the other system.
      function applyJobKind() {
        var rma = jobKind.value === "rma";
        jobOrderLabel.textContent = C.t(rma ? "expert.job_rma_order" : "expert.job_order");
        jobCountField.hidden = rma;
        jobRmaHelp.hidden = !rma;
        if (rma) jobCount.value = "1";
      }

      jobKind.addEventListener("change", applyJobKind);
      jobTemplate.addEventListener("change", loadJobCustomisation);
      jobFilter.addEventListener("change", refreshJobs);
      jobExtraAdd.addEventListener("click", addJobExtra);

      jobForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var templateId = parseInt(jobTemplate.value, 10);
        var order = jobOrder.value.trim();
        var count = jobKind.value === "rma" ? 1 : parseInt(jobCount.value, 10);
        if (!templateId) {
          C.toast(C.t("expert.job_template_required"));
          return;
        }
        if (!order) {
          C.toast(C.t("expert.job_order_required"));
          return;
        }
        if (!(count >= 1 && count <= 20)) {
          C.toast(C.t("expert.job_count_invalid"));
          return;
        }
        var custom = collectCustomisations();
        if (custom.error) {
          C.toast(custom.error);
          return;
        }
        jobCreateBtn.disabled = true;
        try {
          var created = await expertApi("/api/expert/jobs", {
            body: {
              kind: jobKind.value,
              template_id: templateId,
              order_ref: order,
              customer: jobCustomer.value.trim(),
              count: count,
              customisations: custom.customisations,
              note: jobNote.value.trim(),
            },
          });
          C.toast(C.fmt(C.t("expert.job_created"), {
            ids: created.map(function (job) { return "#" + job.id; }).join(", "),
          }));
          jobOrder.value = "";
          jobCustomer.value = "";
          jobCount.value = "1";
          jobNote.value = "";
          await loadJobCustomisation();
          await refreshJobs();
        } catch (err) {
          reportError(err);
        }
        jobCreateBtn.disabled = false;
      });

      // --- Berichte ------------------------------------------------------------------------
      var REP_PAGE = 100;
      var repForm = document.getElementById("rep-form");
      var repQ = document.getElementById("rep-q");
      var repSerial = document.getElementById("rep-serial");
      var repWorker = document.getElementById("rep-worker");
      var repKind = document.getElementById("rep-kind");
      var repStatus = document.getElementById("rep-status");
      var repFrom = document.getElementById("rep-from");
      var repTo = document.getElementById("rep-to");
      var repResetBtn = document.getElementById("rep-reset-btn");
      var repRows = document.getElementById("rep-rows");
      var repEmpty = document.getElementById("rep-empty");
      var repMore = document.getElementById("rep-more");
      var repDetail = document.getElementById("rep-detail");
      var rmaOpenRefresh = document.getElementById("rma-open-refresh");
      var rmaOpenEmpty = document.getElementById("rma-open-empty");
      var rmaOpenList = document.getElementById("rma-open-list");
      var repStatusBoxes = [];
      var repQuery = "";
      var repLoaded = 0;

      var repEl = C.el;

      function repCell(row, text) {
        var td = repEl("td", "", text);
        row.appendChild(td);
        return td;
      }

      function fillRepStatus() {
        clearNode(repStatus);
        repStatusBoxes = [];
        JOB_STATUS_ORDER.forEach(function (status) {
          var label = repEl("label", "field__checkbox-row rep-status__item");
          var box = document.createElement("input");
          box.type = "checkbox";
          box.value = status;
          label.appendChild(box);
          label.appendChild(repEl("span", "", C.t("status." + status)));
          repStatus.appendChild(label);
          repStatusBoxes.push(box);
        });
      }

      function fillRepWorkerAny() {
        // Placeholder so the select always has its "all" option even before workers load.
        clearNode(repWorker);
        var any = repEl("option", "", C.t("reports.worker_any"));
        any.value = "";
        repWorker.appendChild(any);
      }

      async function loadRepWorkers() {
        var chosen = repWorker.value;
        var workers;
        try {
          workers = await expertApi("/api/expert/workers");
        } catch (err) {
          reportError(err);
          return;
        }
        fillRepWorkerAny();
        workers.forEach(function (worker) {
          var option = repEl("option", "", worker.name);
          option.value = String(worker.id);
          repWorker.appendChild(option);
        });
        repWorker.value = chosen;
      }

      // Query string of the search form. No status ticked = every status (the API default hides shipped).
      function repQueryString() {
        var params = [];
        function add(key, value) {
          if (value) params.push(key + "=" + encodeURIComponent(value));
        }
        add("q", repQ.value.trim());
        add("serial", repSerial.value.trim());
        add("worker_id", repWorker.value);
        add("kind", repKind.value);
        add("from", repFrom.value);
        add("to", repTo.value);
        var ticked = repStatusBoxes.filter(function (box) { return box.checked; }).map(function (box) { return box.value; });
        add("status", (ticked.length ? ticked : JOB_STATUS_ORDER).join(","));
        return params.join("&");
      }

      function renderRepRow(job) {
        var row = repEl("tr", "rep-row");
        row.tabIndex = 0;
        row.setAttribute("data-job-id", String(job.id));
        repCell(row, job.order_ref + (job.customer ? " – " + job.customer : ""));
        repCell(row, C.t("expert.job_kind_" + job.kind));
        repCell(row, job.template_name);
        repCell(row, job.unit_count > 1 ? job.unit_no + "/" + job.unit_count : "–");
        repCell(row, C.t("status." + job.status));
        repCell(row, formatTime(job.created_at));
        repCell(row, job.shipped_at ? formatTime(job.shipped_at) : "–");
        repCell(row, job.checked_by_name || "–");
        var dev = repCell(row, "");
        if (job.deviations > 0) {
          dev.appendChild(repEl("span", "state-badge state-badge--not_ok", String(job.deviations)));
        } else {
          dev.textContent = "0";
        }
        function open() { showHistory(job.id); }
        row.addEventListener("click", open);
        row.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
        return row;
      }

      async function runSearch(append) {
        if (repFrom.value && repTo.value && repFrom.value > repTo.value) {
          C.toast(C.t("reports.invalid_range"));
          return;
        }
        if (!append) {
          repQuery = repQueryString();
          repLoaded = 0;
          clearNode(repRows);
        }
        var jobs;
        try {
          jobs = await expertApi("/api/expert/jobs?" + repQuery + "&limit=" + REP_PAGE + "&offset=" + repLoaded);
        } catch (err) {
          reportError(err);
          return;
        }
        jobs.forEach(function (job) { repRows.appendChild(renderRepRow(job)); });
        repLoaded += jobs.length;
        repEmpty.hidden = repLoaded > 0;
        repMore.hidden = jobs.length < REP_PAGE;
      }

      function repKV(key, value) {
        return repEl("span", "rep-kv", C.fmt(C.t(key), value));
      }

      function qualityText(quality) {
        return Object.keys(quality || {}).map(function (point) {
          return point + ": " + C.t(quality[point] === "ok" ? "reports.quality_ok" : "reports.quality_not_ok");
        }).join(", ");
      }

      function photoLink(url) {
        var link = repEl("a", "rep-photo");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener";
        var img = document.createElement("img");
        img.src = url;
        img.alt = C.t("reports.photo");
        img.className = "rep-thumb";
        img.loading = "lazy";
        link.appendChild(img);
        return link;
      }

      function renderConfirmation(c, superseded) {
        var item = repEl("div", "rep-event" + (superseded ? " rep-event--old" : ""));
        item.appendChild(repEl("span", "state-badge state-badge--" + c.result, C.t("pack.state_" + c.result)));
        item.appendChild(repEl("strong", "", c.worker_name));
        item.appendChild(repKV("reports.attempt", { n: c.attempt }));
        if (superseded) item.appendChild(repEl("span", "tag", C.t("reports.superseded")));
        item.appendChild(repKV("reports.qty", { n: c.qty }));
        if (c.serials && c.serials.length) item.appendChild(repKV("reports.serials", { list: c.serials.join(", ") }));
        var quality = qualityText(c.quality);
        if (quality) item.appendChild(repKV("reports.quality", { list: quality }));
        if (c.reason) item.appendChild(repKV("reports.reason", { reason: c.reason }));
        if (c.photo_url) item.appendChild(photoLink(c.photo_url));
        item.appendChild(repEl("span", "rep-time", formatTime(c.created_at)));
        return item;
      }

      function renderHistoryLine(entry) {
        var line = entry.line;
        var box = repEl("div", "rep-line");
        var head = repEl("div", "rep-line__head");
        if (line.item_id) head.appendChild(repEl("span", "bom-table__id", line.item_id));
        head.appendChild(repEl("strong", "", line.label));
        head.appendChild(repKV("reports.line_target", { n: line.qty }));
        head.appendChild(repEl("span", "tag", C.t("reports.stage_" + line.stage)));
        if (line.source === "worker") head.appendChild(repEl("span", "tag tag--warn", C.t("reports.line_worker")));
        box.appendChild(head);
        if (line.withheld) {
          box.appendChild(repEl("p", "field__help", C.fmt(C.t("reports.line_withheld"), { reason: line.withheld_reason })));
        } else if (!entry.confirmations.length) {
          box.appendChild(repEl("p", "field__help", C.t("reports.no_confirmation")));
        }
        entry.confirmations.forEach(function (c, index) {
          box.appendChild(renderConfirmation(c, index < entry.confirmations.length - 1));
        });
        return box;
      }

      function auditDetailText(detail) {
        return Object.keys(detail || {}).map(function (key) {
          var value = detail[key];
          return key + ": " + (value !== null && typeof value === "object" ? JSON.stringify(value) : String(value));
        }).join(" · ");
      }

      function auditActorName(entry) {
        if (entry.actor_name) return entry.actor_name;
        if (entry.actor === "expert") return C.t("reports.actor_expert");
        if (entry.actor === "system") return C.t("reports.actor_system");
        return entry.actor;
      }

      function renderHistory(history) {
        var job = history.job;
        clearNode(repDetail);
        var top = repEl("div", "rep-detail__head");
        top.appendChild(repEl("h2", "", C.fmt(C.t("reports.detail_title"), { id: job.id, order: job.order_ref })));
        var close = repEl("button", "btn btn--secondary", C.t("reports.detail_close"));
        close.type = "button";
        close.addEventListener("click", function () { repDetail.hidden = true; });
        top.appendChild(close);
        repDetail.appendChild(top);

        var meta = repEl("p", "field__help");
        var parts = [
          job.customer,
          C.t("expert.job_kind_" + job.kind),
          C.t("status." + job.status),
          C.fmt(C.t("reports.job_meta"), { template: job.template_name, created: formatTime(job.created_at) }),
        ];
        if (job.claimed_by_name) parts.push(C.fmt(C.t("reports.job_claimed"), { name: job.claimed_by_name }));
        if (job.checked_by_name) parts.push(C.t("reports.col_checked") + ": " + job.checked_by_name);
        if (job.shipped_at) parts.push(C.t("reports.col_shipped") + ": " + formatTime(job.shipped_at));
        meta.textContent = parts.filter(function (x) { return x; }).join(" · ");
        repDetail.appendChild(meta);

        repDetail.appendChild(repEl("h3", "", C.t("reports.lines_title")));
        history.lines.forEach(function (entry) { repDetail.appendChild(renderHistoryLine(entry)); });

        repDetail.appendChild(repEl("h3", "", C.t("reports.checks_title")));
        if (!history.checks.length) repDetail.appendChild(repEl("p", "field__help", C.t("reports.checks_none")));
        history.checks.forEach(function (check) {
          var item = repEl("div", "rep-event");
          var cls = check.result === "ok" ? "ok" : "not_ok";
          item.appendChild(repEl("span", "state-badge state-badge--" + cls, C.t("reports.check_" + check.result)));
          item.appendChild(repEl("strong", "", check.worker_name));
          item.appendChild(repKV("reports.attempt", { n: check.attempt }));
          if (check.note) item.appendChild(repKV("reports.reason", { reason: check.note }));
          if (check.photo_url) item.appendChild(photoLink(check.photo_url));
          item.appendChild(repEl("span", "rep-time", formatTime(check.created_at)));
          repDetail.appendChild(item);
        });

        if (history.repair_notes.length) {
          repDetail.appendChild(repEl("h3", "", C.t("reports.notes_title")));
          history.repair_notes.forEach(function (note) {
            var item = repEl("div", "rep-event");
            item.appendChild(repEl("span", "state-badge state-badge--note-" + note.action, C.t("rma.act_" + note.action)));
            item.appendChild(repEl("strong", "", note.label || note.line_label || note.item_id || ""));
            item.appendChild(repEl("strong", "", note.worker_name));
            item.appendChild(repKV("reports.qty", { n: note.qty }));
            if (note.serial) item.appendChild(repKV("reports.serials", { list: note.serial }));
            if (note.reason) item.appendChild(repKV("reports.reason", { reason: note.reason }));
            item.appendChild(repEl("span", "rep-time", formatTime(note.created_at)));
            repDetail.appendChild(item);
          });
        }

        var audit = document.createElement("details");
        audit.className = "rep-audit";
        audit.appendChild(repEl("summary", "", C.t("reports.audit_title") + " (" + history.audit.length + ")"));
        if (!history.audit.length) audit.appendChild(repEl("p", "field__help", C.t("reports.audit_empty")));
        history.audit.forEach(function (entry) {
          var item = repEl("div", "rep-event");
          var label = C.t("audit." + entry.action);
          item.appendChild(repEl("strong", "", label === "audit." + entry.action ? entry.action : label));
          item.appendChild(repEl("span", "", auditActorName(entry)));
          var text = auditDetailText(entry.detail);
          if (text) item.appendChild(repEl("span", "rep-detail-text", text));
          item.appendChild(repEl("span", "rep-time", formatTime(entry.at)));
          audit.appendChild(item);
        });
        repDetail.appendChild(audit);
      }

      async function showHistory(jobId) {
        var history;
        try {
          history = await expertApi("/api/expert/jobs/" + jobId + "/history");
        } catch (err) {
          reportError(err);
          return;
        }
        renderHistory(history);
        repDetail.hidden = false;
        repDetail.scrollIntoView();
      }

      function daysOpenText(days) {
        if (days <= 0) return C.t("reports.days_open_today");
        if (days === 1) return C.t("reports.days_open_one");
        return C.fmt(C.t("reports.days_open"), { n: days });
      }

      function renderOpenRma(entry) {
        var job = entry.job;
        var card = repEl("div", "rep-rma");
        card.setAttribute("data-job-id", String(job.id));
        var head = repEl("div", "rep-rma__head");
        head.appendChild(repEl("strong", "", job.order_ref + (job.customer ? " – " + job.customer : "")));
        head.appendChild(repEl("span", "tag tag--status", C.t("status." + job.status)));
        head.appendChild(repEl("span", "rep-kv", daysOpenText(job.days_open)));
        var open = repEl("button", "btn btn--secondary", C.t("reports.detail_open"));
        open.type = "button";
        open.addEventListener("click", function () { showHistory(job.id); });
        head.appendChild(open);
        card.appendChild(head);
        if (!entry.lines.length) card.appendChild(repEl("p", "field__help", C.t("reports.rma_none")));
        entry.lines.forEach(function (line) {
          var cls = "rep-rma__line" + (line.delta > 0 ? " rep-rma__line--open" : "");
          var row = repEl("div", cls);
          row.appendChild(repEl("strong", "", line.label));
          row.appendChild(repEl("span", "", C.fmt(C.t("reports.rma_line"), {
            arrived: line.in_qty, kept: line.kept_qty, out: line.out_qty, delta: line.delta,
          })));
          card.appendChild(row);
        });
        return card;
      }

      async function refreshOpenRma() {
        var list;
        try {
          list = await expertApi("/api/expert/rma/open");
        } catch (err) {
          reportError(err);
          return;
        }
        clearNode(rmaOpenList);
        list.forEach(function (entry) { rmaOpenList.appendChild(renderOpenRma(entry)); });
        rmaOpenEmpty.hidden = list.length > 0;
      }

      repForm.addEventListener("submit", function (event) {
        event.preventDefault();
        runSearch(false);
      });
      repMore.addEventListener("click", function () { runSearch(true); });
      repResetBtn.addEventListener("click", function () {
        repForm.reset();
        runSearch(false);
      });
      rmaOpenRefresh.addEventListener("click", refreshOpenRma);

      async function enterReports() {
        fillRepStatus();
        fillRepWorkerAny();
        await loadRepWorkers();
        await runSearch(false);
        await refreshOpenRma();
      }

      // --- Export --------------------------------------------------------------------------
      var exportForm = document.getElementById("export-form");
      var exportFrom = document.getElementById("export-from");
      var exportTo = document.getElementById("export-to");
      var exportKind = document.getElementById("export-kind");
      var exportBtn = document.getElementById("export-btn");

      function isoDate(date) {
        return date.toISOString().slice(0, 10);
      }

      // Default range: the last 90 days (the server counts dates in UTC, like the stored times).
      function fillExportDefaults() {
        var today = new Date();
        exportTo.value = isoDate(today);
        exportFrom.value = isoDate(new Date(today.getTime() - 90 * 24 * 3600 * 1000));
      }

      exportForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (exportFrom.value && exportTo.value && exportFrom.value > exportTo.value) {
          C.toast(C.t("export.invalid_range"));
          return;
        }
        var params = [];
        if (exportFrom.value) params.push("from=" + encodeURIComponent(exportFrom.value));
        if (exportTo.value) params.push("to=" + encodeURIComponent(exportTo.value));
        if (exportKind.value) params.push("kind=" + encodeURIComponent(exportKind.value));
        exportBtn.disabled = true;
        try {
          // The expert header cannot be sent by a plain link: fetch the file and hand it over as a download.
          var blob = await expertApi("/api/expert/export.csv?" + params.join("&"), { blob: true });
          var link = document.createElement("a");
          var url = URL.createObjectURL(blob);
          link.href = url;
          link.download = "galochka-export-" + exportFrom.value + "-" + exportTo.value + ".csv";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
          C.toast(C.t("export.downloaded"));
        } catch (err) {
          reportError(err);
        }
        exportBtn.disabled = false;
      });


      // Called once the password is known to be good (GET /api/expert/settings
      // succeeded); the same call fills the Einstellungen tab, then the Artikel stats load.
      async function enter() {
        await loadSettings();
        showApp();
        await loadItemStats();
        await refreshWorkers();
        await refreshTemplates();
        fillJobFilter();
        await refreshJobTemplates();
        await refreshJobs();
        fillExportDefaults();
        await enterReports();
      }

      settingsForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var minutes = Number(sessionMinutesInput.value);
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 720) {
          C.toast(C.t("expert.minutes_invalid"));
          return;
        }
        var points = qualityPointsInput.value
          .split("\n")
          .map(function (line) { return line.trim(); })
          .filter(function (line) { return line !== ""; });
        if (new Set(points).size !== points.length) {
          C.toast(C.t("expert.points_duplicate"));
          return;
        }
        try {
          await expertApi("/api/expert/settings", {
            method: "PUT",
            body: {
              second_check_default: secondCheckInput.checked,
              session_minutes: minutes,
              default_quality_points: points,
            },
          });
          await loadSettings();
          C.toast(C.t("expert.saved"));
        } catch (err) {
          reportError(err);
        }
      });

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        C.setExpertPassword(passwordInput.value);
        passwordInput.value = "";
        try {
          await enter();
        } catch (err) {
          reportError(err);
        }
      });

      // "Abmelden": forget the expert password on this tab and show the login again.
      document.getElementById("expert-logout").addEventListener("click", function () {
        C.clearExpertPassword();
        switchTab("artikel");
        showLogin();
      });

      tabButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          switchTab(btn.getAttribute("data-tab"));
        });
      });

      async function init() {
        try {
          await C.loadStrings();
        } catch (err) {
          C.toast(C.t("error.generic"));
        }
        // A password kept in sessionStorage survives a reload of the tab.
        if (C.getExpertPassword()) {
          try {
            await enter();
          } catch (err) {
            reportError(err);
          }
        }
      }
      init();
    })();
  </script>
</body>
</html>
