<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="expert.title">galochka</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="wide">
  <nav class="nav">
    <img src="/static/acs_logo.png" alt="ACS" width="32" height="32" class="nav__logo">
    <span class="nav__brand" data-i18n="nav.brand"></span>
    <div class="nav__links">
      <a href="/auftraege" data-i18n="nav.jobs"></a>
    </div>
  </nav>
  <main class="main">
    <h1 data-i18n="expert.title"></h1>

    <form id="login-form" class="login-form">
      <label class="sr-only" for="password-input" data-i18n="expert.password_placeholder"></label>
      <input type="password" id="password-input" class="input-id" data-i18n-placeholder="expert.password_placeholder"
        autocomplete="off">
      <button type="submit" class="btn btn--primary" data-i18n="expert.login"></button>
    </form>

    <div id="app-view" hidden>
      <div class="tabs">
        <button type="button" class="tab-btn" id="tab-btn-artikel" data-tab="artikel" aria-pressed="true" data-i18n="expert.tab_artikel"></button>
        <button type="button" class="tab-btn" id="tab-btn-vorlagen" data-tab="vorlagen" aria-pressed="false" data-i18n="expert.tab_vorlagen"></button>
        <button type="button" class="tab-btn" id="tab-btn-auftraege" data-tab="auftraege" aria-pressed="false" data-i18n="expert.tab_auftraege"></button>
        <button type="button" class="tab-btn" id="tab-btn-mitarbeiter" data-tab="mitarbeiter" aria-pressed="false" data-i18n="expert.tab_mitarbeiter"></button>
        <button type="button" class="tab-btn" id="tab-btn-einstellungen" data-tab="einstellungen" aria-pressed="false" data-i18n="expert.tab_einstellungen"></button>
        <button type="button" class="tab-btn" id="tab-btn-berichte" data-tab="berichte" aria-pressed="false" data-i18n="expert.tab_berichte"></button>
        <button type="button" class="tab-btn" id="tab-btn-export" data-tab="export" aria-pressed="false" data-i18n="expert.tab_export"></button>
        <button type="button" class="tab-btn tab-btn--end" id="expert-logout" data-i18n="nav.logout"></button>
      </div>

      <!-- Later tasks fill these sections (Mitarbeiter: T3, Vorlagen: T4, ...). -->
      <section id="tab-artikel" class="tab-section">
        <p id="items-active" class="field__label"></p>
        <p id="items-synced" class="field__help"></p>
        <p id="items-cassandra" class="field__help"></p>

        <div class="field">
          <p class="field__help" data-i18n="expert.items_sync_help"></p>
          <button type="button" id="items-sync-btn" class="btn btn--primary" data-i18n="expert.items_sync"></button>
          <p id="items-sync-result" class="field__help" role="status"></p>
          <p id="items-sync-warning" class="note" role="alert" hidden></p>
        </div>

        <form id="items-csv-form" class="settings-section">
          <h2 data-i18n="expert.items_csv_title"></h2>
          <p class="field__help" data-i18n="expert.items_csv_help"></p>
          <div class="field">
            <label class="field__label" for="items-csv-file" data-i18n="expert.items_csv_file"></label>
            <input type="file" id="items-csv-file" class="input-id" accept=".csv">
          </div>
          <div class="form-actions">
            <button type="submit" id="items-csv-btn" class="btn btn--secondary" data-i18n="expert.items_csv_import"></button>
            <p id="items-csv-result" class="field__help" role="status"></p>
          </div>
        </form>

        <section id="bom-section" class="settings-section">
          <h2 data-i18n="expert.bom_title"></h2>
          <p class="field__help" data-i18n="expert.bom_help"></p>
          <form id="bom-form">
            <div class="field">
              <label class="field__label" for="bom-file" data-i18n="expert.bom_file"></label>
              <input type="file" id="bom-file" class="input-id" accept=".csv">
            </div>
            <div class="form-actions">
              <button type="submit" id="bom-preview-btn" class="btn btn--secondary" data-i18n="expert.bom_preview"></button>
            </div>
          </form>

          <div id="bom-preview" hidden>
            <p id="bom-summary" class="field__label"></p>
            <div class="field">
              <label class="field__label" for="bom-name" data-i18n="expert.bom_name"></label>
              <input type="text" id="bom-name" class="input-id" maxlength="120" autocomplete="off">
            </div>
            <div class="field">
              <span class="field__label" data-i18n="expert.bom_product"></span>
              <div id="bom-product"></div>
            </div>
            <div class="field">
              <label class="field__checkbox-row" for="bom-mode-new">
                <input type="radio" name="bom-mode" id="bom-mode-new" value="new" checked>
                <span data-i18n="expert.bom_mode_new"></span>
              </label>
              <label class="field__checkbox-row" for="bom-mode-replace" id="bom-mode-replace-row" hidden>
                <input type="radio" name="bom-mode" id="bom-mode-replace" value="replace">
                <span id="bom-mode-replace-text"></span>
              </label>
            </div>
            <div class="field" id="bom-zero-row" hidden>
              <label class="field__checkbox-row" for="bom-zero">
                <input type="checkbox" id="bom-zero">
                <span data-i18n="expert.bom_zero_label"></span>
              </label>
            </div>
            <p id="bom-unknown" class="field__help" hidden></p>
            <div id="bom-lines" class="bom-lines"></div>
            <div class="form-actions">
              <button type="button" id="bom-import-btn" class="btn btn--primary" data-i18n="expert.bom_import"></button>
            </div>
          </div>
        </section>
      </section>
      <section id="tab-vorlagen" class="tab-section" hidden>
        <div id="tpl-list-view">
          <div class="form-actions">
            <button type="button" id="tpl-new-btn" class="btn btn--primary" data-i18n="expert.tpl_new"></button>
          </div>
          <p id="tpl-empty" class="field__help" data-i18n="expert.tpl_empty" hidden></p>
          <div id="tpl-list" class="worker-list"></div>
        </div>

        <form id="tpl-editor" class="settings-section" hidden>
          <h2 id="tpl-editor-title"></h2>
          <div class="field">
            <label class="field__label" for="tpl-name" data-i18n="expert.tpl_name"></label>
            <input type="text" id="tpl-name" class="input-id" maxlength="120" autocomplete="off">
          </div>
          <div class="field">
            <span class="field__label" data-i18n="expert.tpl_product"></span>
            <div id="tpl-product"></div>
          </div>
          <div class="field">
            <label class="field__label" for="tpl-second-check" data-i18n="expert.tpl_second_check"></label>
            <select id="tpl-second-check" class="select">
              <option value="" data-i18n="expert.tpl_second_default"></option>
              <option value="1" data-i18n="expert.tpl_second_yes"></option>
              <option value="0" data-i18n="expert.tpl_second_no"></option>
            </select>
          </div>
          <h2 data-i18n="expert.tpl_lines"></h2>
          <div id="tpl-lines" class="tpl-lines"></div>
          <div class="form-actions">
            <button type="button" id="tpl-add-line" class="btn btn--secondary" data-i18n="expert.tpl_add_line"></button>
          </div>
          <div class="form-actions tpl-editor__actions">
            <button type="submit" id="tpl-save-btn" class="btn btn--primary" data-i18n="expert.save"></button>
            <button type="button" id="tpl-cancel-btn" class="btn btn--secondary" data-i18n="expert.tpl_cancel"></button>
          </div>
        </form>
      </section>
      <section id="tab-auftraege" class="tab-section" hidden>
        <form id="job-form" class="job-form">
          <h2 data-i18n="expert.jobs_title"></h2>
          <div class="field">
            <label class="field__label" for="job-kind" data-i18n="expert.job_kind"></label>
            <select id="job-kind" class="select">
              <option value="delivery" data-i18n="expert.job_kind_delivery"></option>
              <option value="rma" data-i18n="expert.job_kind_rma"></option>
            </select>
            <p class="field__help" id="job-rma-help" data-i18n="expert.job_rma_help" hidden></p>
          </div>
          <div class="field">
            <label class="field__label" for="job-template" data-i18n="expert.job_template"></label>
            <select id="job-template" class="select"></select>
          </div>
          <div class="field">
            <label class="field__label" id="job-order-label" for="job-order" data-i18n="expert.job_order"></label>
            <input type="text" id="job-order" class="input-id" maxlength="40" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="job-customer" data-i18n="expert.job_customer"></label>
            <input type="text" id="job-customer" class="input-id" maxlength="80" autocomplete="off">
          </div>
          <div class="field" id="job-count-field">
            <label class="field__label" for="job-count" data-i18n="expert.job_count"></label>
            <input type="number" id="job-count" class="input-id" min="1" max="20" value="1" inputmode="numeric">
          </div>
          <div class="field">
            <label class="field__label" for="job-note" data-i18n="expert.job_note"></label>
            <input type="text" id="job-note" class="input-id" maxlength="500" autocomplete="off">
          </div>
          <div id="job-custom" class="settings-section" hidden>
            <h2 data-i18n="expert.job_custom_title"></h2>
            <p class="field__help" data-i18n="expert.job_custom_help"></p>
            <div id="job-lines"></div>
            <div id="job-extras"></div>
            <div class="form-actions">
              <button type="button" id="job-extra-add" class="btn btn--secondary" data-i18n="expert.job_extra_add"></button>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" id="job-create-btn" class="btn btn--primary" data-i18n="expert.job_create"></button>
          </div>
        </form>

        <div class="settings-section">
          <h2 data-i18n="expert.jobs_list"></h2>
          <div class="field">
            <label class="field__label" for="job-filter" data-i18n="expert.jobs_filter"></label>
            <select id="job-filter" class="select"></select>
          </div>
          <div class="bom-lines">
            <table class="bom-table job-table" id="job-table">
              <thead>
                <tr>
                  <th data-i18n="expert.jobs_col_order"></th>
                  <th data-i18n="expert.jobs_col_template"></th>
                  <th data-i18n="expert.jobs_col_carton"></th>
                  <th data-i18n="expert.jobs_col_status"></th>
                  <th data-i18n="expert.jobs_col_claimed"></th>
                  <th data-i18n="expert.jobs_col_progress"></th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="job-rows"></tbody>
            </table>
          </div>
          <p id="job-empty" class="field__help" data-i18n="expert.jobs_empty" hidden></p>
        </div>
      </section>
      <section id="tab-mitarbeiter" class="tab-section" hidden>
        <form id="worker-form">
          <h2 data-i18n="expert.workers_title"></h2>
          <div class="field">
            <label class="field__label" for="worker-name" data-i18n="expert.worker_name"></label>
            <input type="text" id="worker-name" class="input-id" maxlength="80" autocomplete="off">
          </div>
          <div class="form-actions">
            <button type="submit" id="worker-create-btn" class="btn btn--primary" data-i18n="expert.worker_create"></button>
          </div>
        </form>
        <div id="worker-created" class="note worker-created" role="status" hidden>
          <p id="worker-created-text"></p>
          <a id="worker-created-print" class="btn btn--secondary" target="_blank" rel="opener"
            data-i18n="expert.worker_print"></a>
        </div>

        <h2 data-i18n="expert.workers_list"></h2>
        <p id="workers-empty" class="field__help" data-i18n="expert.workers_empty" hidden></p>
        <div id="worker-list" class="worker-list"></div>
      </section>

      <section id="tab-einstellungen" class="tab-section" hidden>
        <form id="settings-form">
          <div class="field">
            <label class="field__checkbox-row" for="second-check-default">
              <input type="checkbox" id="second-check-default">
              <span data-i18n="expert.second_check_default"></span>
            </label>
            <p class="field__help" data-i18n="expert.second_check_default_help"></p>
          </div>
          <div class="field">
            <label class="field__label" for="session-minutes" data-i18n="expert.session_minutes"></label>
            <p class="field__help" data-i18n="expert.session_minutes_help"></p>
            <input type="number" id="session-minutes" class="select" step="1" min="1" max="720">
          </div>
          <div class="field">
            <label class="field__label" for="quality-points" data-i18n="expert.quality_points"></label>
            <p class="field__help" data-i18n="expert.quality_points_help"></p>
            <textarea id="quality-points" class="input-id" rows="4"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="settings-save-btn" class="btn btn--primary" data-i18n="expert.save"></button>
          </div>
        </form>
      </section>

      <section id="tab-berichte" class="tab-section" hidden>
        <form id="rep-form" class="job-form">
          <h2 data-i18n="reports.search_title"></h2>
          <div class="field">
            <label class="field__label" for="rep-q" data-i18n="reports.q"></label>
            <input type="search" id="rep-q" class="input-id" maxlength="200" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="rep-serial" data-i18n="reports.serial"></label>
            <input type="text" id="rep-serial" class="input-id" maxlength="200" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="rep-worker" data-i18n="reports.worker"></label>
            <select id="rep-worker" class="select"></select>
          </div>
          <div class="field">
            <label class="field__label" for="rep-kind" data-i18n="reports.kind"></label>
            <select id="rep-kind" class="select">
              <option value="" data-i18n="reports.kind_any"></option>
              <option value="delivery" data-i18n="expert.job_kind_delivery"></option>
              <option value="rma" data-i18n="expert.job_kind_rma"></option>
            </select>
          </div>
          <div class="field">
            <span class="field__label" data-i18n="reports.status"></span>
            <div id="rep-status" class="rep-status"></div>
          </div>
          <div class="field">
            <label class="field__label" for="rep-from" data-i18n="reports.from"></label>
            <input type="date" id="rep-from" class="select">
          </div>
          <div class="field">
            <label class="field__label" for="rep-to" data-i18n="reports.to"></label>
            <input type="date" id="rep-to" class="select">
          </div>
          <div class="form-actions">
            <button type="submit" id="rep-search-btn" class="btn btn--primary" data-i18n="reports.search"></button>
            <button type="button" id="rep-reset-btn" class="btn btn--secondary" data-i18n="reports.reset"></button>
          </div>
        </form>

        <div class="settings-section">
          <h2 data-i18n="reports.results"></h2>
          <div class="bom-lines">
            <table class="bom-table job-table" id="rep-table">
              <thead>
                <tr>
                  <th data-i18n="reports.col_order"></th>
                  <th data-i18n="reports.col_kind"></th>
                  <th data-i18n="reports.col_template"></th>
                  <th data-i18n="reports.col_carton"></th>
                  <th data-i18n="reports.col_status"></th>
                  <th data-i18n="reports.col_created"></th>
                  <th data-i18n="reports.col_shipped"></th>
                  <th data-i18n="reports.col_checked"></th>
                  <th data-i18n="reports.col_deviations"></th>
                </tr>
              </thead>
              <tbody id="rep-rows"></tbody>
            </table>
          </div>
          <p id="rep-empty" class="field__help" data-i18n="reports.empty" hidden></p>
          <div class="form-actions">
            <button type="button" id="rep-more" class="btn btn--secondary" data-i18n="reports.more" hidden></button>
          </div>
        </div>

        <div id="rep-detail" class="settings-section rep-detail" hidden></div>

        <div class="settings-section">
          <h2 data-i18n="reports.open_rma_title"></h2>
          <div class="form-actions">
            <button type="button" id="rma-open-refresh" class="btn btn--secondary" data-i18n="reports.open_rma_refresh"></button>
          </div>
          <p id="rma-open-empty" class="field__help" data-i18n="reports.open_rma_empty" hidden></p>
          <div id="rma-open-list"></div>
        </div>
      </section>
      <section id="tab-export" class="tab-section" hidden>
        <form id="export-form" class="job-form">
          <h2 data-i18n="export.title"></h2>
          <p class="field__help" data-i18n="export.help"></p>
          <div class="field">
            <label class="field__label" for="export-from" data-i18n="export.from"></label>
            <input type="date" id="export-from" class="select">
          </div>
          <div class="field">
            <label class="field__label" for="export-to" data-i18n="export.to"></label>
            <input type="date" id="export-to" class="select">
          </div>
          <div class="field">
            <label class="field__label" for="export-kind" data-i18n="export.kind"></label>
            <select id="export-kind" class="select">
              <option value="" data-i18n="export.kind_any"></option>
              <option value="delivery" data-i18n="expert.job_kind_delivery"></option>
              <option value="rma" data-i18n="expert.job_kind_rma"></option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" id="export-btn" class="btn btn--primary" data-i18n="export.download"></button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    (function () {
      var loginForm = document.getElementById("login-form");
      var passwordInput = document.getElementById("password-input");
      var appView = document.getElementById("app-view");

      var tabButtons = document.querySelectorAll(".tab-btn[data-tab]");
      var tabNames = ["artikel", "vorlagen", "auftraege", "mitarbeiter", "einstellungen", "berichte", "export"];

      var settingsForm = document.getElementById("settings-form");
      var secondCheckInput = document.getElementById("second-check-default");
      var sessionMinutesInput = document.getElementById("session-minutes");
      var qualityPointsInput = document.getElementById("quality-points");

      function reportError(err) {
        // expertApi() already shows expert.wrong_password and clears the stored
        // password on 401; avoid a second, redundant toast here.
        if (err && err.status === 401) return;
        C.reportError(err);
      }

      function showLogin() {
        appView.hidden = true;
        loginForm.hidden = false;
      }

      function showApp() {
        loginForm.hidden = true;
        appView.hidden = false;
      }

      async function expertApi(path, opts) {
        try {
          return await C.expertApi(path, opts);
        } catch (err) {
          if (err && err.status === 401) {
            showLogin();
          }
          throw err;
        }
      }

      function switchTab(name) {
        tabNames.forEach(function (key) {
          document.getElementById("tab-" + key).hidden = key !== name;
        });
        tabButtons.forEach(function (btn) {
          btn.setAttribute("aria-pressed", String(btn.getAttribute("data-tab") === name));
        });
        // Templates and jobs change elsewhere (Vorlagen tab, workers on the floor): reload when the tab opens.
        if (name === "auftraege" && jobFilter.options.length) {
          refreshJobTemplates();
          refreshJobs();
        }
        if (name === "berichte" && repStatusBoxes.length) {
          loadRepWorkers();
          refreshOpenRma();
        }
      }

      var itemsActive = document.getElementById("items-active");
      var itemsSynced = document.getElementById("items-synced");
      var itemsCassandra = document.getElementById("items-cassandra");
      var itemsSyncBtn = document.getElementById("items-sync-btn");
      var itemsSyncResult = document.getElementById("items-sync-result");
      var itemsSyncWarning = document.getElementById("items-sync-warning");
      var itemsCsvForm = document.getElementById("items-csv-form");
      var itemsCsvFile = document.getElementById("items-csv-file");
      var itemsCsvBtn = document.getElementById("items-csv-btn");
      var itemsCsvResult = document.getElementById("items-csv-result");

      function formatTime(iso) {
        var d = new Date(iso);
        return isNaN(d.getTime()) ? iso : d.toLocaleString("de-DE");
      }

      function fillItemStats(stats) {
        itemsActive.textContent = C.t("expert.items_active").replace("{count}", String(stats.total_active));
        itemsSynced.textContent = stats.synced_at
          ? C.t("expert.items_synced_at").replace("{time}", formatTime(stats.synced_at))
          : C.t("expert.items_never_synced");
        itemsCassandra.textContent = stats.cassandra_url
          ? C.t("expert.items_cassandra").replace("{url}", stats.cassandra_url)
          : C.t("expert.items_cassandra_none");
        itemsSyncBtn.disabled = !stats.cassandra_url;
      }

      async function loadItemStats() {
        fillItemStats(await expertApi("/api/expert/items/stats"));
      }

      function itemsResultText(result) {
        return C.t("expert.items_result")
          .replace("{added}", String(result.added))
          .replace("{updated}", String(result.updated))
          .replace("{deactivated}", String(result.deactivated))
          .replace("{total_active}", String(result.total_active));
      }

      itemsSyncBtn.addEventListener("click", async function () {
        itemsSyncBtn.disabled = true;
        itemsSyncResult.textContent = C.t("expert.items_sync_running");
        itemsSyncWarning.hidden = true;
        try {
          var result = await expertApi("/api/expert/sync/items", { method: "POST" });
          itemsSyncResult.textContent = itemsResultText(result);
          // The listing from Cassandra was cut off: nothing was deactivated, the expert must know.
          if (result.warning) {
            itemsSyncWarning.textContent = result.warning;
            itemsSyncWarning.hidden = false;
          }
        } catch (err) {
          itemsSyncResult.textContent = "";
          reportError(err);
        }
        itemsSyncBtn.disabled = false;
        try {
          await loadItemStats();
        } catch (err) {
          reportError(err);
        }
      });

      itemsCsvForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var file = itemsCsvFile.files && itemsCsvFile.files[0];
        if (!file) {
          C.toast(C.t("expert.items_csv_none"));
          return;
        }
        var formData = new FormData();
        formData.append("file", file, file.name);
        itemsCsvBtn.disabled = true;
        try {
          var result = await expertApi("/api/expert/import/items", { formData: formData });
          itemsCsvResult.textContent = itemsResultText(result);
          itemsCsvFile.value = "";
          await loadItemStats();
        } catch (err) {
          itemsCsvResult.textContent = "";
          reportError(err);
        }
        itemsCsvBtn.disabled = false;
      });

      function fillSettings(settings) {
        secondCheckInput.checked = !!settings.second_check_default;
        sessionMinutesInput.value = String(settings.session_minutes);
        qualityPointsInput.value = settings.default_quality_points.join("\n");
      }

      async function loadSettings() {
        fillSettings(await expertApi("/api/expert/settings"));
      }


      // --- Mitarbeiter -------------------------------------------------------------------
      var workerForm = document.getElementById("worker-form");
      var workerNameInput = document.getElementById("worker-name");
      var workerCreateBtn = document.getElementById("worker-create-btn");
      var workerCreated = document.getElementById("worker-created");
      var workerCreatedText = document.getElementById("worker-created-text");
      var workerCreatedPrint = document.getElementById("worker-created-print");
      var workerList = document.getElementById("worker-list");
      var workersEmpty = document.getElementById("workers-empty");

      function workerButton(labelKey, onClick) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn--secondary";
        btn.textContent = C.t(labelKey);
        btn.addEventListener("click", onClick);
        return btn;
      }

      function renderWorker(worker) {
        var row = document.createElement("div");
        row.className = "worker-row" + (worker.active ? "" : " worker-row--inactive");

        var info = document.createElement("div");
        info.className = "worker-row__info";
        var name = document.createElement("div");
        name.className = "worker-row__name";
        name.textContent = worker.name;
        info.appendChild(name);
        var meta = document.createElement("div");
        meta.className = "worker-row__meta";
        if (worker.badge) {
          var code = document.createElement("span");
          code.className = "worker-row__code";
          code.textContent = worker.badge.short_code;
          meta.appendChild(document.createTextNode(C.t("expert.worker_code").split("{code}")[0]));
          meta.appendChild(code);
          meta.appendChild(document.createTextNode(C.t("expert.worker_code").split("{code}")[1] || ""));
        } else {
          meta.appendChild(document.createTextNode(C.t("expert.worker_no_badge")));
        }
        if (!worker.active) {
          meta.appendChild(document.createTextNode(" \u00b7 " + C.t("expert.worker_inactive")));
        }
        info.appendChild(meta);
        row.appendChild(info);

        var actions = document.createElement("div");
        actions.className = "worker-row__actions";
        if (worker.badge) {
          var print = document.createElement("a");
          print.className = "btn btn--secondary";
          print.href = "/druck/badge/" + worker.id;
          print.target = "_blank";
          // same origin: the print tab inherits the expert password from sessionStorage (needs the opener)
          print.rel = "opener";
          print.textContent = C.t("expert.worker_print");
          actions.appendChild(print);
        }
        actions.appendChild(workerButton("expert.worker_reissue", function () { reissueBadge(worker); }));
        if (worker.badge) {
          actions.appendChild(workerButton("expert.worker_revoke", function () { revokeBadge(worker); }));
        }
        actions.appendChild(
          workerButton(worker.active ? "expert.worker_deactivate" : "expert.worker_activate", function () {
            setWorkerActive(worker, !worker.active);
          })
        );
        row.appendChild(actions);
        return row;
      }

      async function loadWorkers() {
        var workers = await expertApi("/api/expert/workers");
        while (workerList.firstChild) workerList.removeChild(workerList.firstChild);
        workers.forEach(function (worker) {
          workerList.appendChild(renderWorker(worker));
        });
        workersEmpty.hidden = workers.length > 0;
      }

      function showCreated(text, workerId) {
        workerCreatedText.textContent = text;

        workerCreated.hidden = false;

      async function refreshWorkers() {

          await loadWorkers();

          reportError(err);
        }
      }

      async function reissueBadge(worker) {
        if (!window.confirm(C.fmt(C.t("expert.worker_reissue_confirm"), { name: worker.name }))) return;
        try {
          var badge = await expertApi("/api/expert/workers/" + worker.id + "/badge", { method: "POST" });
          showCreated(C.fmt(C.t("expert.worker_reissued"), { name: worker.name, code: badge.short_code }), worker.id);
        } catch (err) {
          reportError(err);
        }
        await refreshWorkers();
      }

      async function revokeBadge(worker) {
        if (!window.confirm(C.fmt(C.t("expert.worker_revoke_confirm"), { name: worker.name }))) return;
        try {
          await expertApi("/api/expert/workers/" + worker.id + "/badge", { method: "DELETE" });
          workerCreated.hidden = true;
          C.toast(C.t("expert.worker_revoked"));
        } catch (err) {
          reportError(err);
        }
        await refreshWorkers();
      }

      async function setWorkerActive(worker, active) {
        try {
          await expertApi("/api/expert/workers/" + worker.id, { method: "PATCH", body: { active: active } });
        } catch (err) {
          reportError(err);
        }
        await refreshWorkers();
      }

      workerForm.addEventListener("submit", async function (event) {
        event.preventDefault();

          C.toast(C.t("expert.worker_name_required"));

        }

          reportError(err);
