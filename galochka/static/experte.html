<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="expert.title">galochka</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <img src="/static/acs_logo.png" alt="ACS" width="32" height="32" class="nav__logo">
    <span class="nav__brand" data-i18n="nav.brand"></span>
    <div class="nav__links">
      <a href="/auftraege" data-i18n="nav.jobs"></a>
    </div>
  </nav>
  <main class="main">
    <h1 data-i18n="expert.title"></h1>

    <form id="login-form" class="login-form">
      <input type="password" id="password-input" class="input-id" data-i18n-placeholder="expert.password_placeholder"
        autocomplete="off">
      <button type="submit" class="btn btn--primary" data-i18n="expert.login"></button>
    </form>

    <div id="app-view" hidden>
      <div class="tabs">
        <button type="button" class="tab-btn" id="tab-btn-artikel" data-tab="artikel" aria-pressed="true" data-i18n="expert.tab_artikel"></button>
        <button type="button" class="tab-btn" id="tab-btn-vorlagen" data-tab="vorlagen" aria-pressed="false" data-i18n="expert.tab_vorlagen"></button>
        <button type="button" class="tab-btn" id="tab-btn-auftraege" data-tab="auftraege" aria-pressed="false" data-i18n="expert.tab_auftraege"></button>
        <button type="button" class="tab-btn" id="tab-btn-mitarbeiter" data-tab="mitarbeiter" aria-pressed="false" data-i18n="expert.tab_mitarbeiter"></button>
        <button type="button" class="tab-btn" id="tab-btn-einstellungen" data-tab="einstellungen" aria-pressed="false" data-i18n="expert.tab_einstellungen"></button>
        <button type="button" class="tab-btn" id="tab-btn-berichte" data-tab="berichte" aria-pressed="false" data-i18n="expert.tab_berichte"></button>
        <button type="button" class="tab-btn" id="tab-btn-export" data-tab="export" aria-pressed="false" data-i18n="expert.tab_export"></button>
      </div>

      <!-- Later tasks fill these sections (Mitarbeiter: T3, Vorlagen: T4, ...). -->
      <section id="tab-artikel" class="tab-section">
        <p id="items-active" class="field__label"></p>
        <p id="items-synced" class="field__help"></p>
        <p id="items-cassandra" class="field__help"></p>

        <div class="field">
          <p class="field__help" data-i18n="expert.items_sync_help"></p>
          <button type="button" id="items-sync-btn" class="btn btn--primary" data-i18n="expert.items_sync"></button>
          <p id="items-sync-result" class="field__help" role="status"></p>
        </div>

        <form id="items-csv-form" class="settings-section">
          <h2 data-i18n="expert.items_csv_title"></h2>
          <p class="field__help" data-i18n="expert.items_csv_help"></p>
          <div class="field">
            <label class="field__label" for="items-csv-file" data-i18n="expert.items_csv_file"></label>
            <input type="file" id="items-csv-file" class="input-id" accept=".csv">
          </div>
          <div class="form-actions">
            <button type="submit" id="items-csv-btn" class="btn btn--secondary" data-i18n="expert.items_csv_import"></button>
            <p id="items-csv-result" class="field__help" role="status"></p>
          </div>
        </form>
      </section>
      <section id="tab-vorlagen" class="tab-section" hidden></section>
      <section id="tab-auftraege" class="tab-section" hidden></section>
      <section id="tab-mitarbeiter" class="tab-section" hidden></section>

      <section id="tab-einstellungen" class="tab-section" hidden>
        <form id="settings-form">
          <div class="field">
            <label class="field__checkbox-row" for="second-check-default">
              <input type="checkbox" id="second-check-default">
              <span data-i18n="expert.second_check_default"></span>
            </label>
            <p class="field__help" data-i18n="expert.second_check_default_help"></p>
          </div>
          <div class="field">
            <label class="field__label" for="session-minutes" data-i18n="expert.session_minutes"></label>
            <p class="field__help" data-i18n="expert.session_minutes_help"></p>
            <input type="number" id="session-minutes" class="select" step="1" min="1" max="720">
          </div>
          <div class="field">
            <label class="field__label" for="quality-points" data-i18n="expert.quality_points"></label>
            <p class="field__help" data-i18n="expert.quality_points_help"></p>
            <textarea id="quality-points" class="input-id" rows="4"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="settings-save-btn" class="btn btn--primary" data-i18n="expert.save"></button>
          </div>
        </form>
      </section>

      <section id="tab-berichte" class="tab-section" hidden></section>
      <section id="tab-export" class="tab-section" hidden></section>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    (function () {
      var loginForm = document.getElementById("login-form");
      var passwordInput = document.getElementById("password-input");
      var appView = document.getElementById("app-view");

      var tabButtons = document.querySelectorAll(".tab-btn");
      var tabNames = ["artikel", "vorlagen", "auftraege", "mitarbeiter", "einstellungen", "berichte", "export"];

      var settingsForm = document.getElementById("settings-form");
      var secondCheckInput = document.getElementById("second-check-default");
      var sessionMinutesInput = document.getElementById("session-minutes");
      var qualityPointsInput = document.getElementById("quality-points");

      function reportError(err) {
        // expertApi() already shows expert.wrong_password and clears the stored
        // password on 401; avoid a second, redundant toast here.
        if (err && err.status === 401) return;
        C.toast((err && err.detail) || C.t("error.generic"));
      }

      function showLogin() {
        appView.hidden = true;
        loginForm.hidden = false;
      }

      function showApp() {
        loginForm.hidden = true;
        appView.hidden = false;
      }

      async function expertApi(path, opts) {
        try {
          return await C.expertApi(path, opts);
        } catch (err) {
          if (err && err.status === 401) {
            showLogin();
          }
          throw err;
        }
      }

      function switchTab(name) {
        tabNames.forEach(function (key) {
          document.getElementById("tab-" + key).hidden = key !== name;
        });
        tabButtons.forEach(function (btn) {
          btn.setAttribute("aria-pressed", String(btn.getAttribute("data-tab") === name));
        });
      }

      var itemsActive = document.getElementById("items-active");
      var itemsSynced = document.getElementById("items-synced");
      var itemsCassandra = document.getElementById("items-cassandra");
      var itemsSyncBtn = document.getElementById("items-sync-btn");
      var itemsSyncResult = document.getElementById("items-sync-result");
      var itemsCsvForm = document.getElementById("items-csv-form");
      var itemsCsvFile = document.getElementById("items-csv-file");
      var itemsCsvBtn = document.getElementById("items-csv-btn");
      var itemsCsvResult = document.getElementById("items-csv-result");

      function formatTime(iso) {
        var d = new Date(iso);
        return isNaN(d.getTime()) ? iso : d.toLocaleString("de-DE");
      }

      function fillItemStats(stats) {
        itemsActive.textContent = C.t("expert.items_active").replace("{count}", String(stats.total_active));
        itemsSynced.textContent = stats.synced_at
          ? C.t("expert.items_synced_at").replace("{time}", formatTime(stats.synced_at))
          : C.t("expert.items_never_synced");
        itemsCassandra.textContent = stats.cassandra_url
          ? C.t("expert.items_cassandra").replace("{url}", stats.cassandra_url)
          : C.t("expert.items_cassandra_none");
        itemsSyncBtn.disabled = !stats.cassandra_url;
      }

      async function loadItemStats() {
        fillItemStats(await expertApi("/api/expert/items/stats"));
      }

      function itemsResultText(result) {
        return C.t("expert.items_result")
          .replace("{added}", String(result.added))
          .replace("{updated}", String(result.updated))
          .replace("{deactivated}", String(result.deactivated))
          .replace("{total_active}", String(result.total_active));
      }

      itemsSyncBtn.addEventListener("click", async function () {
        itemsSyncBtn.disabled = true;
        itemsSyncResult.textContent = C.t("expert.items_sync_running");
        try {
          var result = await expertApi("/api/expert/sync/items", { method: "POST" });
          itemsSyncResult.textContent = itemsResultText(result);
        } catch (err) {
          itemsSyncResult.textContent = "";
          reportError(err);
        }
        itemsSyncBtn.disabled = false;
        try {
          await loadItemStats();
        } catch (err) {
          reportError(err);
        }
      });

      itemsCsvForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var file = itemsCsvFile.files && itemsCsvFile.files[0];
        if (!file) {
          C.toast(C.t("expert.items_csv_none"));
          return;
        }
        var formData = new FormData();
        formData.append("file", file, file.name);
        itemsCsvBtn.disabled = true;
        try {
          var result = await expertApi("/api/expert/import/items", { formData: formData });
          itemsCsvResult.textContent = itemsResultText(result);
          itemsCsvFile.value = "";
          await loadItemStats();
        } catch (err) {
          itemsCsvResult.textContent = "";
          reportError(err);
        }
        itemsCsvBtn.disabled = false;
      });

      function fillSettings(settings) {
        secondCheckInput.checked = !!settings.second_check_default;
        sessionMinutesInput.value = String(settings.session_minutes);
        qualityPointsInput.value = settings.default_quality_points.join("\n");
      }

      async function loadSettings() {
        fillSettings(await expertApi("/api/expert/settings"));
      }

      // Called once the password is known to be good (GET /api/expert/settings
      // succeeded); the same call fills the Einstellungen tab, then the Artikel stats load.
      async function enter() {
        await loadSettings();
        showApp();
        await loadItemStats();
      }

      settingsForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var minutes = Number(sessionMinutesInput.value);
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 720) {
          C.toast(C.t("expert.minutes_invalid"));
          return;
        }
        var points = qualityPointsInput.value
          .split("\n")
          .map(function (line) { return line.trim(); })
          .filter(function (line) { return line !== ""; });
        if (new Set(points).size !== points.length) {
          C.toast(C.t("expert.points_duplicate"));
          return;
        }
        try {
          await expertApi("/api/expert/settings", {
            method: "PUT",
            body: {
              second_check_default: secondCheckInput.checked,
              session_minutes: minutes,
              default_quality_points: points,
            },
          });
          await loadSettings();
          C.toast(C.t("expert.saved"));
        } catch (err) {
          reportError(err);
        }
      });

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        C.setExpertPassword(passwordInput.value);
        passwordInput.value = "";
        try {
          await enter();
        } catch (err) {
          reportError(err);
        }
      });

      tabButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          switchTab(btn.getAttribute("data-tab"));
        });
      });

      async function init() {
        try {
          await C.loadStrings();
        } catch (err) {
          C.toast(C.t("error.generic"));
        }
        // A password kept in sessionStorage survives a reload of the tab.
        if (C.getExpertPassword()) {
          try {
            await enter();
          } catch (err) {
            reportError(err);
          }
        }
      }
      init();
    })();
  </script>
</body>
</html>
