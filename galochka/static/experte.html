<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="expert.title">galochka</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <img src="/static/acs_logo.png" alt="ACS" width="32" height="32" class="nav__logo">
    <span class="nav__brand" data-i18n="nav.brand"></span>
    <div class="nav__links">
      <a href="/auftraege" data-i18n="nav.jobs"></a>
    </div>
  </nav>
  <main class="main">
    <h1 data-i18n="expert.title"></h1>

    <form id="login-form" class="login-form">
      <input type="password" id="password-input" class="input-id" data-i18n-placeholder="expert.password_placeholder"
        autocomplete="off">
      <button type="submit" class="btn btn--primary" data-i18n="expert.login"></button>
    </form>

    <div id="app-view" hidden>
      <div class="tabs">
        <button type="button" class="tab-btn" id="tab-btn-artikel" data-tab="artikel" aria-pressed="true" data-i18n="expert.tab_artikel"></button>
        <button type="button" class="tab-btn" id="tab-btn-vorlagen" data-tab="vorlagen" aria-pressed="false" data-i18n="expert.tab_vorlagen"></button>
        <button type="button" class="tab-btn" id="tab-btn-auftraege" data-tab="auftraege" aria-pressed="false" data-i18n="expert.tab_auftraege"></button>
        <button type="button" class="tab-btn" id="tab-btn-mitarbeiter" data-tab="mitarbeiter" aria-pressed="false" data-i18n="expert.tab_mitarbeiter"></button>
        <button type="button" class="tab-btn" id="tab-btn-einstellungen" data-tab="einstellungen" aria-pressed="false" data-i18n="expert.tab_einstellungen"></button>
        <button type="button" class="tab-btn" id="tab-btn-berichte" data-tab="berichte" aria-pressed="false" data-i18n="expert.tab_berichte"></button>
        <button type="button" class="tab-btn" id="tab-btn-export" data-tab="export" aria-pressed="false" data-i18n="expert.tab_export"></button>
      </div>

      <!-- Later tasks fill these sections (Mitarbeiter: T3, Vorlagen: T4, ...). -->
      <section id="tab-artikel" class="tab-section">
        <p id="items-active" class="field__label"></p>
        <p id="items-synced" class="field__help"></p>
        <p id="items-cassandra" class="field__help"></p>

        <div class="field">
          <p class="field__help" data-i18n="expert.items_sync_help"></p>
          <button type="button" id="items-sync-btn" class="btn btn--primary" data-i18n="expert.items_sync"></button>
          <p id="items-sync-result" class="field__help" role="status"></p>
        </div>

        <form id="items-csv-form" class="settings-section">
          <h2 data-i18n="expert.items_csv_title"></h2>
          <p class="field__help" data-i18n="expert.items_csv_help"></p>
          <div class="field">
            <label class="field__label" for="items-csv-file" data-i18n="expert.items_csv_file"></label>
            <input type="file" id="items-csv-file" class="input-id" accept=".csv">
          </div>
          <div class="form-actions">
            <button type="submit" id="items-csv-btn" class="btn btn--secondary" data-i18n="expert.items_csv_import"></button>
            <p id="items-csv-result" class="field__help" role="status"></p>
          </div>
        </form>

        <section id="bom-section" class="settings-section">
          <h2 data-i18n="expert.bom_title"></h2>
          <p class="field__help" data-i18n="expert.bom_help"></p>
          <form id="bom-form">
            <div class="field">
              <label class="field__label" for="bom-file" data-i18n="expert.bom_file"></label>
              <input type="file" id="bom-file" class="input-id" accept=".csv">
            </div>
            <div class="form-actions">
              <button type="submit" id="bom-preview-btn" class="btn btn--secondary" data-i18n="expert.bom_preview"></button>
            </div>
          </form>

          <div id="bom-preview" hidden>
            <p id="bom-summary" class="field__label"></p>
            <div class="field">
              <label class="field__label" for="bom-name" data-i18n="expert.bom_name"></label>
              <input type="text" id="bom-name" class="input-id" maxlength="120" autocomplete="off">
            </div>
            <div class="field">
              <span class="field__label" data-i18n="expert.bom_product"></span>
              <div id="bom-product"></div>
            </div>
            <div class="field">
              <label class="field__checkbox-row" for="bom-mode-new">
                <input type="radio" name="bom-mode" id="bom-mode-new" value="new" checked>
                <span data-i18n="expert.bom_mode_new"></span>
              </label>
              <label class="field__checkbox-row" for="bom-mode-replace" id="bom-mode-replace-row" hidden>
                <input type="radio" name="bom-mode" id="bom-mode-replace" value="replace">
                <span id="bom-mode-replace-text"></span>
              </label>
            </div>
            <div class="field" id="bom-zero-row" hidden>
              <label class="field__checkbox-row" for="bom-zero">
                <input type="checkbox" id="bom-zero">
                <span data-i18n="expert.bom_zero_label"></span>
              </label>
            </div>
            <p id="bom-unknown" class="field__help" hidden></p>
            <div id="bom-lines" class="bom-lines"></div>
            <div class="form-actions">
              <button type="button" id="bom-import-btn" class="btn btn--primary" data-i18n="expert.bom_import"></button>
            </div>
          </div>
        </section>
      </section>
      <section id="tab-vorlagen" class="tab-section" hidden>
        <div id="tpl-list-view">
          <div class="form-actions">
            <button type="button" id="tpl-new-btn" class="btn btn--primary" data-i18n="expert.tpl_new"></button>
          </div>
          <p id="tpl-empty" class="field__help" data-i18n="expert.tpl_empty" hidden></p>
          <div id="tpl-list" class="worker-list"></div>
        </div>

        <form id="tpl-editor" class="settings-section" hidden>
          <h2 id="tpl-editor-title"></h2>
          <div class="field">
            <label class="field__label" for="tpl-name" data-i18n="expert.tpl_name"></label>
            <input type="text" id="tpl-name" class="input-id" maxlength="120" autocomplete="off">
          </div>
          <div class="field">
            <span class="field__label" data-i18n="expert.tpl_product"></span>
            <div id="tpl-product"></div>
          </div>
          <div class="field">
            <label class="field__label" for="tpl-second-check" data-i18n="expert.tpl_second_check"></label>
            <select id="tpl-second-check" class="select">
              <option value="" data-i18n="expert.tpl_second_default"></option>
              <option value="1" data-i18n="expert.tpl_second_yes"></option>
              <option value="0" data-i18n="expert.tpl_second_no"></option>
            </select>
          </div>
          <h2 data-i18n="expert.tpl_lines"></h2>
          <div id="tpl-lines" class="tpl-lines"></div>
          <div class="form-actions">
            <button type="button" id="tpl-add-line" class="btn btn--secondary" data-i18n="expert.tpl_add_line"></button>
          </div>
          <div class="form-actions tpl-editor__actions">
            <button type="submit" id="tpl-save-btn" class="btn btn--primary" data-i18n="expert.save"></button>
            <button type="button" id="tpl-cancel-btn" class="btn btn--secondary" data-i18n="expert.tpl_cancel"></button>
          </div>
        </form>
      </section>
      <section id="tab-auftraege" class="tab-section" hidden>
        <form id="job-form" class="job-form">
          <h2 data-i18n="expert.jobs_title"></h2>
          <div class="field">
            <label class="field__label" for="job-kind" data-i18n="expert.job_kind"></label>
            <select id="job-kind" class="select">
              <option value="delivery" data-i18n="expert.job_kind_delivery"></option>
              <option value="rma" data-i18n="expert.job_kind_rma" disabled></option>
            </select>
          </div>
          <div class="field">
            <label class="field__label" for="job-template" data-i18n="expert.job_template"></label>
            <select id="job-template" class="select"></select>
          </div>
          <div class="field">
            <label class="field__label" for="job-order" data-i18n="expert.job_order"></label>
            <input type="text" id="job-order" class="input-id" maxlength="40" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="job-customer" data-i18n="expert.job_customer"></label>
            <input type="text" id="job-customer" class="input-id" maxlength="80" autocomplete="off">
          </div>
          <div class="field">
            <label class="field__label" for="job-count" data-i18n="expert.job_count"></label>
            <input type="number" id="job-count" class="input-id" min="1" max="20" value="1" inputmode="numeric">
          </div>
          <div class="field">
            <label class="field__label" for="job-note" data-i18n="expert.job_note"></label>
            <input type="text" id="job-note" class="input-id" maxlength="500" autocomplete="off">
          </div>
          <div id="job-custom" class="settings-section" hidden>
            <h2 data-i18n="expert.job_custom_title"></h2>
            <p class="field__help" data-i18n="expert.job_custom_help"></p>
            <div id="job-lines"></div>
            <div id="job-extras"></div>
            <div class="form-actions">
              <button type="button" id="job-extra-add" class="btn btn--secondary" data-i18n="expert.job_extra_add"></button>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" id="job-create-btn" class="btn btn--primary" data-i18n="expert.job_create"></button>
          </div>
        </form>

        <div class="settings-section">
          <h2 data-i18n="expert.jobs_list"></h2>
          <div class="field">
            <label class="field__label" for="job-filter" data-i18n="expert.jobs_filter"></label>
            <select id="job-filter" class="select"></select>
          </div>
          <div class="bom-lines">
            <table class="bom-table job-table" id="job-table">
              <thead>
                <tr>
                  <th data-i18n="expert.jobs_col_order"></th>
                  <th data-i18n="expert.jobs_col_template"></th>
                  <th data-i18n="expert.jobs_col_carton"></th>
                  <th data-i18n="expert.jobs_col_status"></th>
                  <th data-i18n="expert.jobs_col_claimed"></th>
                  <th data-i18n="expert.jobs_col_progress"></th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="job-rows"></tbody>
            </table>
          </div>
          <p id="job-empty" class="field__help" data-i18n="expert.jobs_empty" hidden></p>
        </div>
      </section>
      <section id="tab-mitarbeiter" class="tab-section" hidden>
        <form id="worker-form">
          <h2 data-i18n="expert.workers_title"></h2>
          <div class="field">
            <label class="field__label" for="worker-name" data-i18n="expert.worker_name"></label>
            <input type="text" id="worker-name" class="input-id" maxlength="80" autocomplete="off">
          </div>
          <div class="form-actions">
            <button type="submit" id="worker-create-btn" class="btn btn--primary" data-i18n="expert.worker_create"></button>
          </div>
        </form>
        <div id="worker-created" class="note worker-created" role="status" hidden>
          <p id="worker-created-text"></p>
          <a id="worker-created-print" class="btn btn--secondary" target="_blank" rel="noopener"
            data-i18n="expert.worker_print"></a>
        </div>

        <h2 data-i18n="expert.workers_list"></h2>
        <p id="workers-empty" class="field__help" data-i18n="expert.workers_empty" hidden></p>
        <div id="worker-list" class="worker-list"></div>
      </section>

      <section id="tab-einstellungen" class="tab-section" hidden>
        <form id="settings-form">
          <div class="field">
            <label class="field__checkbox-row" for="second-check-default">
              <input type="checkbox" id="second-check-default">
              <span data-i18n="expert.second_check_default"></span>
            </label>
            <p class="field__help" data-i18n="expert.second_check_default_help"></p>
          </div>
          <div class="field">
            <label class="field__label" for="session-minutes" data-i18n="expert.session_minutes"></label>
            <p class="field__help" data-i18n="expert.session_minutes_help"></p>
            <input type="number" id="session-minutes" class="select" step="1" min="1" max="720">
          </div>
          <div class="field">
            <label class="field__label" for="quality-points" data-i18n="expert.quality_points"></label>
            <p class="field__help" data-i18n="expert.quality_points_help"></p>
            <textarea id="quality-points" class="input-id" rows="4"></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" id="settings-save-btn" class="btn btn--primary" data-i18n="expert.save"></button>
          </div>
        </form>
      </section>

      <section id="tab-berichte" class="tab-section" hidden></section>
      <section id="tab-export" class="tab-section" hidden></section>
    </div>
  </main>

  <script src="/static/app.js"></script>
  <script>
    (function () {
      var loginForm = document.getElementById("login-form");
      var passwordInput = document.getElementById("password-input");
      var appView = document.getElementById("app-view");

      var tabButtons = document.querySelectorAll(".tab-btn");
      var tabNames = ["artikel", "vorlagen", "auftraege", "mitarbeiter", "einstellungen", "berichte", "export"];

      var settingsForm = document.getElementById("settings-form");
      var secondCheckInput = document.getElementById("second-check-default");
      var sessionMinutesInput = document.getElementById("session-minutes");
      var qualityPointsInput = document.getElementById("quality-points");

      function reportError(err) {
        // expertApi() already shows expert.wrong_password and clears the stored
        // password on 401; avoid a second, redundant toast here.
        if (err && err.status === 401) return;
        C.toast((err && err.detail) || C.t("error.generic"));
      }

      function showLogin() {
        appView.hidden = true;
        loginForm.hidden = false;
      }

      function showApp() {
        loginForm.hidden = true;
        appView.hidden = false;
      }

      async function expertApi(path, opts) {
        try {
          return await C.expertApi(path, opts);
        } catch (err) {
          if (err && err.status === 401) {
            showLogin();
          }
          throw err;
        }
      }

      function switchTab(name) {
        tabNames.forEach(function (key) {
          document.getElementById("tab-" + key).hidden = key !== name;
        });
        tabButtons.forEach(function (btn) {
          btn.setAttribute("aria-pressed", String(btn.getAttribute("data-tab") === name));
        });
        // Templates and jobs change elsewhere (Vorlagen tab, workers on the floor): reload when the tab opens.
        if (name === "auftraege" && jobFilter.options.length) {
          refreshJobTemplates();
          refreshJobs();
        }
      }

      var itemsActive = document.getElementById("items-active");
      var itemsSynced = document.getElementById("items-synced");
      var itemsCassandra = document.getElementById("items-cassandra");
      var itemsSyncBtn = document.getElementById("items-sync-btn");
      var itemsSyncResult = document.getElementById("items-sync-result");
      var itemsCsvForm = document.getElementById("items-csv-form");
      var itemsCsvFile = document.getElementById("items-csv-file");
      var itemsCsvBtn = document.getElementById("items-csv-btn");
      var itemsCsvResult = document.getElementById("items-csv-result");

      function formatTime(iso) {
        var d = new Date(iso);
        return isNaN(d.getTime()) ? iso : d.toLocaleString("de-DE");
      }

      function fillItemStats(stats) {
        itemsActive.textContent = C.t("expert.items_active").replace("{count}", String(stats.total_active));
        itemsSynced.textContent = stats.synced_at
          ? C.t("expert.items_synced_at").replace("{time}", formatTime(stats.synced_at))
          : C.t("expert.items_never_synced");
        itemsCassandra.textContent = stats.cassandra_url
          ? C.t("expert.items_cassandra").replace("{url}", stats.cassandra_url)
          : C.t("expert.items_cassandra_none");
        itemsSyncBtn.disabled = !stats.cassandra_url;
      }

      async function loadItemStats() {
        fillItemStats(await expertApi("/api/expert/items/stats"));
      }

      function itemsResultText(result) {
        return C.t("expert.items_result")
          .replace("{added}", String(result.added))
          .replace("{updated}", String(result.updated))
          .replace("{deactivated}", String(result.deactivated))
          .replace("{total_active}", String(result.total_active));
      }

      itemsSyncBtn.addEventListener("click", async function () {
        itemsSyncBtn.disabled = true;
        itemsSyncResult.textContent = C.t("expert.items_sync_running");
        try {
          var result = await expertApi("/api/expert/sync/items", { method: "POST" });
          itemsSyncResult.textContent = itemsResultText(result);
        } catch (err) {
          itemsSyncResult.textContent = "";
          reportError(err);
        }
        itemsSyncBtn.disabled = false;
        try {
          await loadItemStats();
        } catch (err) {
          reportError(err);
        }
      });

      itemsCsvForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var file = itemsCsvFile.files && itemsCsvFile.files[0];
        if (!file) {
          C.toast(C.t("expert.items_csv_none"));
          return;
        }
        var formData = new FormData();
        formData.append("file", file, file.name);
        itemsCsvBtn.disabled = true;
        try {
          var result = await expertApi("/api/expert/import/items", { formData: formData });
          itemsCsvResult.textContent = itemsResultText(result);
          itemsCsvFile.value = "";
          await loadItemStats();
        } catch (err) {
          itemsCsvResult.textContent = "";
          reportError(err);
        }
        itemsCsvBtn.disabled = false;
      });

      function fillSettings(settings) {
        secondCheckInput.checked = !!settings.second_check_default;
        sessionMinutesInput.value = String(settings.session_minutes);
        qualityPointsInput.value = settings.default_quality_points.join("\n");
      }

      async function loadSettings() {
        fillSettings(await expertApi("/api/expert/settings"));
      }


      // --- Mitarbeiter -------------------------------------------------------------------
      var workerForm = document.getElementById("worker-form");
      var workerNameInput = document.getElementById("worker-name");
      var workerCreateBtn = document.getElementById("worker-create-btn");
      var workerCreated = document.getElementById("worker-created");
      var workerCreatedText = document.getElementById("worker-created-text");
      var workerCreatedPrint = document.getElementById("worker-created-print");
      var workerList = document.getElementById("worker-list");
      var workersEmpty = document.getElementById("workers-empty");

      function workerButton(labelKey, onClick) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn--secondary";
        btn.textContent = C.t(labelKey);
        btn.addEventListener("click", onClick);
        return btn;
      }

      function renderWorker(worker) {
        var row = document.createElement("div");
        row.className = "worker-row" + (worker.active ? "" : " worker-row--inactive");

        var info = document.createElement("div");
        info.className = "worker-row__info";
        var name = document.createElement("div");
        name.className = "worker-row__name";
        name.textContent = worker.name;
        info.appendChild(name);
        var meta = document.createElement("div");
        meta.className = "worker-row__meta";
        if (worker.badge) {
          var code = document.createElement("span");
          code.className = "worker-row__code";
          code.textContent = worker.badge.short_code;
          meta.appendChild(document.createTextNode(C.t("expert.worker_code").split("{code}")[0]));
          meta.appendChild(code);
          meta.appendChild(document.createTextNode(C.t("expert.worker_code").split("{code}")[1] || ""));
        } else {
          meta.appendChild(document.createTextNode(C.t("expert.worker_no_badge")));
        }
        if (!worker.active) {
          meta.appendChild(document.createTextNode(" \u00b7 " + C.t("expert.worker_inactive")));
        }
        info.appendChild(meta);
        row.appendChild(info);

        var actions = document.createElement("div");
        actions.className = "worker-row__actions";
        if (worker.badge) {
          var print = document.createElement("a");
          print.className = "btn btn--secondary";
          print.href = "/druck/badge/" + worker.id;
          print.target = "_blank";
          print.rel = "noopener";
          print.textContent = C.t("expert.worker_print");
          actions.appendChild(print);
        }
        actions.appendChild(workerButton("expert.worker_reissue", function () { reissueBadge(worker); }));
        if (worker.badge) {
          actions.appendChild(workerButton("expert.worker_revoke", function () { revokeBadge(worker); }));
        }
        actions.appendChild(
          workerButton(worker.active ? "expert.worker_deactivate" : "expert.worker_activate", function () {
            setWorkerActive(worker, !worker.active);
          })
        );
        row.appendChild(actions);
        return row;
      }

      async function loadWorkers() {
        var workers = await expertApi("/api/expert/workers");
        while (workerList.firstChild) workerList.removeChild(workerList.firstChild);
        workers.forEach(function (worker) {
          workerList.appendChild(renderWorker(worker));
        });
        workersEmpty.hidden = workers.length > 0;
      }

      function showCreated(text, workerId) {
        workerCreatedText.textContent = text;
        workerCreatedPrint.href = "/druck/badge/" + workerId;
        workerCreated.hidden = false;
      }

      async function refreshWorkers() {
        try {
          await loadWorkers();
        } catch (err) {
          reportError(err);
        }
      }

      async function reissueBadge(worker) {
        if (!window.confirm(C.fmt(C.t("expert.worker_reissue_confirm"), { name: worker.name }))) return;
        try {
          var badge = await expertApi("/api/expert/workers/" + worker.id + "/badge", { method: "POST" });
          showCreated(C.fmt(C.t("expert.worker_reissued"), { name: worker.name, code: badge.short_code }), worker.id);
        } catch (err) {
          reportError(err);
        }
        await refreshWorkers();
      }

      async function revokeBadge(worker) {
        if (!window.confirm(C.fmt(C.t("expert.worker_revoke_confirm"), { name: worker.name }))) return;
        try {
          await expertApi("/api/expert/workers/" + worker.id + "/badge", { method: "DELETE" });
          workerCreated.hidden = true;
          C.toast(C.t("expert.worker_revoked"));
        } catch (err) {
          reportError(err);
        }
        await refreshWorkers();
      }

      async function setWorkerActive(worker, active) {
        try {
          await expertApi("/api/expert/workers/" + worker.id, { method: "PATCH", body: { active: active } });
        } catch (err) {
          reportError(err);
        }
        await refreshWorkers();
      }

      workerForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var name = workerNameInput.value.trim();
        if (!name) {
          C.toast(C.t("expert.worker_name_required"));
          return;
        }
        workerCreateBtn.disabled = true;
        try {
          var created = await expertApi("/api/expert/workers", { body: { name: name } });
          workerNameInput.value = "";
          showCreated(
            C.fmt(C.t("expert.worker_created"), { name: created.name, code: created.badge.short_code }),
            created.id
          );
        } catch (err) {
          reportError(err);
        }
        workerCreateBtn.disabled = false;
        await refreshWorkers();
      });

      // --- Artikelsuche (Vorlagen-Editor and BOM-Import) ----------------------------------
      function clearNode(el) {
        while (el.firstChild) el.removeChild(el.firstChild);
      }

      function itemLabel(id, name) {
        return name ? id + " – " + name : id;
      }

      // Text input with a small dropdown fed by GET /api/items?q=. `initial` is {id, name} or null.
      // The chosen item id is only set by picking from the list; editing the text clears it.
      function makeItemPicker(initial) {
        var wrap = document.createElement("div");
        wrap.className = "item-picker";
        var input = document.createElement("input");
        input.type = "text";
        input.className = "input-id";
        input.setAttribute("autocomplete", "off");
        input.setAttribute("placeholder", C.t("expert.tpl_item_placeholder"));
        var list = document.createElement("div");
        list.className = "item-picker__list";
        list.hidden = true;
        wrap.appendChild(input);
        wrap.appendChild(list);

        var picked = null;
        var seq = 0;
        var timer = null;

        function hideList() {
          seq += 1;
          list.hidden = true;
          clearNode(list);
        }

        function pick(item) {
          picked = item;
          input.value = item ? itemLabel(item.id, item.name) : "";
          hideList();
        }

        function showResults(items) {
          clearNode(list);
          if (!items.length) {
            var none = document.createElement("div");
            none.className = "item-picker__none";
            none.textContent = C.t("expert.tpl_item_none");
            list.appendChild(none);
          }
          items.forEach(function (item) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "item-picker__option";
            btn.textContent = itemLabel(item.item_id, item.name);
            // mousedown (not click) so the input does not lose focus first
            btn.addEventListener("mousedown", function (event) {
              event.preventDefault();
              pick({ id: item.item_id, name: item.name });
            });
            list.appendChild(btn);
          });
          list.hidden = false;
        }

        async function search() {
          var q = input.value.trim();
          seq += 1;
          var mine = seq;
          if (!q) {
            hideList();
            return;
          }
          var items;
          try {
            items = await expertApi("/api/items?q=" + encodeURIComponent(q) + "&limit=10");
          } catch (err) {
            return;
          }
          if (mine !== seq) return;
          showResults(items);
        }

        input.addEventListener("input", function () {
          picked = null;
          if (timer) clearTimeout(timer);
          timer = setTimeout(search, 250);
        });
        input.addEventListener("blur", function () {
          setTimeout(hideList, 150);
        });
        if (initial && initial.id) pick(initial);

        return {
          el: wrap,
          getId: function () { return picked ? picked.id : null; },
          // true when the field is empty (no item) or an item was picked from the list
          isValid: function () { return input.value.trim() === "" || picked !== null; },
        };
      }

          second_check: tpl.second_check,

      async function setTemplateActive(tpl, active) {

      function renumberLines() {
        var rows = tplLines.children;
        for (var i = 0; i < rows.length; i++) {
          rows[i]._line.number.textContent = String(i + 1);
        }

      function lineLabelled(labelKey, control) {
        var wrap = document.createElement("label");
        wrap.className = "field";
        var span = document.createElement("span");
        span.className = "field__label";

      function lineCheckbox(labelKey, checked) {

        box.type = "checkbox";
        box.checked = checked;

        wrap.appendChild(span);

      function lineIconButton(text, titleKey, onClick) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn--secondary tpl-line__btn";
        btn.textContent = text;
        btn.title = C.t(titleKey);

        return btn;
      }

      function textInput(value, maxLength) {
        var input = document.createElement("input");
        input.type = "text";
        input.className = "input-id";
        input.maxLength = maxLength;
        input.setAttribute("autocomplete", "off");
        input.value = value || "";
        return input;
      }

      // Append one editable line to the editor. `line` is a template line from the API or null.
      function addLineRow(line) {
        line = line || {};
        var row = document.createElement("div");
        row.className = "tpl-line";

        var head = document.createElement("div");
        head.className = "tpl-line__head";
        var number = document.createElement("span");
        number.className = "tpl-line__no";
        head.appendChild(number);
        head.appendChild(
          lineIconButton("↑", "expert.tpl_line_up", function () {
            var prev = row.previousElementSibling;
            if (prev) tplLines.insertBefore(row, prev);
            renumberLines();
          })
        );
        head.appendChild(
          lineIconButton("↓", "expert.tpl_line_down", function () {
            var next = row.nextElementSibling;
            if (next) tplLines.insertBefore(next, row);
            renumberLines();
          })
        );
        head.appendChild(
          lineIconButton("✕", "expert.tpl_line_remove", function () {
            tplLines.removeChild(row);
            renumberLines();
          })
        );
        row.appendChild(head);

        var picker = makeItemPicker(line.item_id ? { id: line.item_id, name: line.item_name } : null);
        var itemField = document.createElement("div");
        itemField.className = "field";
        var itemLab = document.createElement("span");
        itemLab.className = "field__label";
        itemLab.textContent = C.t("expert.tpl_line_item");
        itemField.appendChild(itemLab);
        itemField.appendChild(picker.el);
        row.appendChild(itemField);

        var labelInput = textInput(line.label, 120);
        row.appendChild(lineLabelled("expert.tpl_line_label", labelInput));
        var instrInput = textInput(line.instruction, 500);
        row.appendChild(lineLabelled("expert.tpl_line_instruction", instrInput));

        var qtyInput = document.createElement("input");
        qtyInput.type = "number";
        qtyInput.className = "select";
        qtyInput.min = "1";
        qtyInput.max = "999";
        qtyInput.step = "1";
        qtyInput.value = String(line.qty || 1);
        row.appendChild(lineLabelled("expert.tpl_line_qty", qtyInput));

        var photo = lineCheckbox("expert.tpl_line_photo", line.photo_required !== false);
        var serial = lineCheckbox("expert.tpl_line_serial", !!line.serial_required);
        row.appendChild(photo.el);
        row.appendChild(serial.el);

        var pointsInput = textInput((line.quality_points || []).join(", "), 700);
        row.appendChild(lineLabelled("expert.tpl_line_points", pointsInput));

        row._line = {
          id: line.id === undefined ? null : line.id,
          photoItemId: line.photo_item_id || null,
          number: number,
          picker: picker,
          labelInput: labelInput,
          instrInput: instrInput,
          qtyInput: qtyInput,
          photo: photo.box,
          serial: serial.box,
          pointsInput: pointsInput,
        };
        tplLines.appendChild(row);
        renumberLines();
        return row;
      }

      // Read the editor into a request body, or toast the problem and return null.
      function collectTemplate() {
        var name = tplNameInput.value.trim();
        if (!name) {
          C.toast(C.t("expert.tpl_name_required"));
          return null;
        }
        if (!tplProductPicker.isValid()) {
          C.toast(C.t("expert.tpl_item_pick"));
          return null;
        }
        var lines = [];
        var rows = tplLines.children;
        for (var i = 0; i < rows.length; i++) {
          var st = rows[i]._line;
          if (!st.picker.isValid()) {
            C.toast(C.t("expert.tpl_item_pick"));
            return null;
          }
          var itemId = st.picker.getId();
          var label = st.labelInput.value.trim();
          if (!label && !itemId) {
            C.toast(C.t("expert.tpl_label_required"));
            return null;
          }
          var qtyText = st.qtyInput.value.trim();
          var qty = /^\d+$/.test(qtyText) ? parseInt(qtyText, 10) : 0;
          if (qty < 1 || qty > 999) {
            C.toast(C.t("expert.tpl_qty_invalid"));
            return null;
          }
          var points = st.pointsInput.value
            .split(",")
            .map(function (p) { return p.trim(); })
            .filter(function (p) { return p !== ""; });
          var tooLong = points.some(function (p) { return p.length > 60; });
          if (points.length > 10 || tooLong || points.filter(function (p, k) { return points.indexOf(p) !== k; }).length) {
            C.toast(C.t("expert.tpl_points_invalid"));
            return null;
          }
          lines.push({
            id: st.id,
            item_id: itemId,
            label: label,
            instruction: st.instrInput.value.trim(),
            qty: qty,
            photo_required: st.photo.checked,
            serial_required: st.serial.checked,
            quality_points: points,
            photo_item_id: st.photoItemId,
          });
        }
        return {
          name: name,
          product_item_id: tplProductPicker.getId(),
          second_check: secondCheckValue(),
          lines: lines,
        };
      }

      // template = full template from the API, or null for a new one.
      function openEditor(template) {
        tplEditingId = template ? template.id : null;
        tplEditingActive = template ? template.active : true;
        tplEditorTitle.textContent = C.t(template ? "expert.tpl_editor_edit" : "expert.tpl_editor_new");
        tplNameInput.value = template ? template.name : "";
        clearNode(tplProduct);
        tplProductPicker = makeItemPicker(
          template && template.product_item_id ? { id: template.product_item_id, name: template.product_name } : null
        );
        tplProduct.appendChild(tplProductPicker.el);
        tplSecondCheck.value = template && template.second_check !== null ? (template.second_check ? "1" : "0") : "";
        clearNode(tplLines);
        (template ? template.lines : []).forEach(function (line) { addLineRow(line); });
        tplListView.hidden = true;
        tplEditor.hidden = false;
        if (tplEditor.scrollIntoView) tplEditor.scrollIntoView();
      }

      function closeEditor() {
        tplEditor.hidden = true;
        tplListView.hidden = false;
        tplEditingId = null;
      }

      async function editTemplate(id) {
        try {
          openEditor(await expertApi("/api/expert/templates/" + id));

          reportError(err);
        }

            await expertApi("/api/expert/templates", { body: body });

            await expertApi("/api/expert/templates/" + tplEditingId, { method: "PUT", body: body });
          }

          closeEditor();
          await refreshTemplates();

      function bomFormData(dry) {

      function bomCell(row, text, className) {
        var td = document.createElement("td");
        if (className) td.className = className;
        td.textContent = text;
        row.appendChild(td);
        return td;
      }

      function renderBomLines(lines) {
        clearNode(bomLines);
        var table = document.createElement("table");
        table.className = "bom-table";
        var headRow = document.createElement("tr");
        ["expert.bom_col_pos", "expert.bom_col_item", "expert.bom_col_name", "expert.bom_col_qty", "expert.bom_col_known"]
          .forEach(function (key) {
            var th = document.createElement("th");

          bomCell(tr, line.item_id, "bom-table__id");
          var text = line.item_name || line.label;
          if (line.version) text += " · " + line.version;
          if (line.skipped_zero_qty) text += " – " + C.t("expert.bom_skipped");
          bomCell(tr, text);
          bomCell(tr, String(line.qty));
          bomCell(tr, line.known ? "✓" : "✗");
          table.appendChild(tr);
        });
        bomLines.appendChild(table);

      // keep = true: a re-preview (zero-quantity box) must not overwrite what the expert typed.
      function renderBomPreview(data, keep) {
        bomData = data;
        var product = data.product_item_id
          ? itemLabel(data.product_item_id, data.product_name) +
            (data.product_known ? "" : " (" + C.t("expert.bom_product_unknown") + ")")
          : "–";
        bomSummary.textContent = C.fmt(C.t("expert.bom_summary"), {
          bom_number: data.bom_number,
          bom_name: data.bom_name,
          product: product,
        });
        if (!keep) {
          bomNameInput.value = data.bom_name || data.bom_number;
          clearNode(bomProduct);
          bomProductPicker = makeItemPicker(
            data.product_known ? { id: data.product_item_id, name: data.product_name } : null
          );
          bomProduct.appendChild(bomProductPicker.el);
          bomModeNew.checked = true;
        }
        if (data.existing_template_id) {
          var existing = templatesCache.filter(function (tpl) { return tpl.id === data.existing_template_id; })[0];
          bomModeReplaceText.textContent = C.fmt(C.t("expert.bom_mode_replace"), {

        clearNode(jobTemplate);
        var blank = document.createElement("option");
        blank.value = "";
        blank.textContent = C.t("expert.job_template_choose");
        jobTemplate.appendChild(blank);
        templates.forEach(function (tpl) {
          var option = document.createElement("option");
          option.value = String(tpl.id);
          option.textContent = tpl.name;
          jobTemplate.appendChild(option);
        });
        jobTemplate.value = chosen;
        if (jobTemplate.value !== chosen) await loadJobCustomisation();
      }

      function jobLabeledInput(placeholderKey, type) {
        var input = document.createElement("input");
        input.type = type || "text";
        input.className = "input-id";
        input.setAttribute("autocomplete", "off");
        input.setAttribute("placeholder", C.t(placeholderKey));
        return input;
      }

      // Lines of the chosen template: a "weglassen" checkbox and a reason field each.
      async function loadJobCustomisation() {
        clearNode(jobLines);
        clearNode(jobExtras);
        jobLineControls = [];
        jobExtraControls = [];
        var templateId = parseInt(jobTemplate.value, 10);
        jobCustom.hidden = !templateId;
        if (!templateId) return;
        var template;
        try {
          template = await expertApi("/api/expert/templates/" + templateId);
        } catch (err) {
          reportError(err);
          return;
        }
        template.lines.forEach(function (line) {
          var row = document.createElement("div");
          row.className = "tpl-line";
          row.setAttribute("data-template-line", String(line.id));
          var head = document.createElement("label");
          head.className = "field__checkbox-row";
          var omit = document.createElement("input");
          omit.type = "checkbox";
          var text = document.createElement("span");
          text.textContent = line.qty + " × " + line.label + " – " + C.t("expert.job_omit");
          head.appendChild(omit);
          head.appendChild(text);
          var reason = jobLabeledInput("expert.job_omit_reason");
          reason.maxLength = 200;
          reason.hidden = true;
          omit.addEventListener("change", function () { reason.hidden = !omit.checked; });
          row.appendChild(head);
          row.appendChild(reason);
          jobLines.appendChild(row);
          jobLineControls.push({ line: line, omit: omit, reason: reason });
        });
      }

      function addJobExtra() {
        var wrap = document.createElement("div");
        wrap.className = "tpl-line";
        var picker = makeItemPicker(null);
        var label = jobLabeledInput("expert.job_extra_label");
        label.maxLength = 120;
        var qty = jobLabeledInput("expert.job_extra_qty", "number");
        qty.min = "1";
        qty.max = "999";
        qty.value = "1";
        var reason = jobLabeledInput("expert.job_extra_reason");
        reason.maxLength = 200;
        var remove = workerButton("expert.job_extra_remove", function () {
          jobExtras.removeChild(wrap);
          jobExtraControls = jobExtraControls.filter(function (c) { return c.wrap !== wrap; });
        });
        [picker.el, label, qty, reason, remove].forEach(function (node) {
          node.style.marginTop = "8px";
          wrap.appendChild(node);
        });
        jobExtras.appendChild(wrap);
        jobExtraControls.push({ wrap: wrap, picker: picker, label: label, qty: qty, reason: reason });
      }

      // Returns {customisations} or {error: text}.
      function collectCustomisations() {
        var out = [];
        for (var i = 0; i < jobLineControls.length; i += 1) {
          var c = jobLineControls[i];
          if (!c.omit.checked) continue;
          var why = c.reason.value.trim();
          if (why.length < 3) return { error: C.t("expert.job_reason_required") };
          out.push({ template_line_id: c.line.id, withheld: true, reason: why });
        }
        for (var j = 0; j < jobExtraControls.length; j += 1) {
          var x = jobExtraControls[j];
          if (!x.picker.isValid()) return { error: C.t("expert.tpl_item_pick") };
          var itemId = x.picker.getId();
          var label = x.label.value.trim();
          var qty = parseInt(x.qty.value, 10);
          var reason = x.reason.value.trim();
          if ((!label && !itemId) || !(qty >= 1 && qty <= 999)) return { error: C.t("expert.job_extra_invalid") };
          if (reason.length < 3) return { error: C.t("expert.job_reason_required") };
          var extra = { qty: qty, reason: reason };
          if (itemId) extra.item_id = itemId;
          if (label) extra.label = label;
          out.push(extra);
        }
        return { customisations: out };
      }

      function jobCell(row, text) {
        var td = document.createElement("td");
        td.textContent = text;
        row.appendChild(td);
        return td;
      }

      // Status the expert can send a finished or cancelled job back to (null = no reopen).
      function reopenTarget(job) {
        if (job.status === "cancelled") return job.kind === "rma" ? "intake" : "open";
        if (job.status === "packed" || job.status === "checked" || job.status === "shipped") {
          return job.kind === "rma" ? "outgoing" : "packing";
        }
        return null;
      }

      async function patchJob(job, status, doneKey) {
        try {
          await expertApi("/api/expert/jobs/" + job.id, { method: "PATCH", body: { status: status } });
          C.toast(C.t(doneKey));
        } catch (err) {
          reportError(err);
        }
        await refreshJobs();
      }

      function jobActionButton(labelKey, onClick) {
        var btn = workerButton(labelKey, onClick);
        return btn;
      }

      function renderJobRow(job) {
        var row = document.createElement("tr");
        row.setAttribute("data-job-id", String(job.id));
        jobCell(row, job.order_ref + (job.customer ? " – " + job.customer : ""));
        jobCell(row, job.template_name);
        jobCell(row, job.unit_count > 1 ? C.fmt(C.t("jobs.carton"), { n: job.unit_no, total: job.unit_count }) : "–");
        jobCell(row, C.t("status." + job.status));
        jobCell(row, job.claimed_by_name || "–");
        jobCell(row, C.fmt(C.t("jobs.progress"), { done: job.lines_done, total: job.lines_total }));
        var actions = document.createElement("td");
        if (job.status !== "shipped" && job.status !== "cancelled") {
          actions.appendChild(jobActionButton("expert.job_cancel", function () {
            if (!window.confirm(C.fmt(C.t("expert.job_cancel_confirm"), { order: job.order_ref }))) return;
            patchJob(job, "cancelled", "expert.job_cancelled");
          }));
        }
        var target = reopenTarget(job);
        if (target) {
          actions.appendChild(jobActionButton("expert.job_reopen", function () {
            if (!window.confirm(C.fmt(C.t("expert.job_reopen_confirm"), { order: job.order_ref }))) return;
            patchJob(job, target, "expert.job_reopened");
          }));
        }
        var label = document.createElement("a");
        label.className = "btn btn--secondary";
        label.href = "/druck/etikett/" + job.id;
        label.target = "_blank";
        label.rel = "noopener";
        label.textContent = C.t("expert.job_label");
        actions.appendChild(label);
        row.appendChild(actions);
        return row;
      }

      async function refreshJobs() {
        var query = jobFilter.value ? "?status=" + encodeURIComponent(jobFilter.value) : "";
        var jobs;
        try {
          jobs = await expertApi("/api/expert/jobs" + query);
        } catch (err) {
          reportError(err);
          return;
        }
        clearNode(jobRows);
        jobs.forEach(function (job) { jobRows.appendChild(renderJobRow(job)); });
        jobEmpty.hidden = jobs.length > 0;
      }

      jobTemplate.addEventListener("change", loadJobCustomisation);
      jobFilter.addEventListener("change", refreshJobs);
      jobExtraAdd.addEventListener("click", addJobExtra);

      jobForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var templateId = parseInt(jobTemplate.value, 10);
        var order = jobOrder.value.trim();
        var count = parseInt(jobCount.value, 10);
        if (!templateId) {
          C.toast(C.t("expert.job_template_required"));
          return;
        }
        if (!order) {
          C.toast(C.t("expert.job_order_required"));
          return;
        }
        if (!(count >= 1 && count <= 20)) {
          C.toast(C.t("expert.job_count_invalid"));
          return;
        }
        var custom = collectCustomisations();
        if (custom.error) {
          C.toast(custom.error);
          return;
        }
        jobCreateBtn.disabled = true;
        try {
          var created = await expertApi("/api/expert/jobs", {
            body: {
              kind: "delivery",
              template_id: templateId,
              order_ref: order,
              customer: jobCustomer.value.trim(),
              count: count,
              customisations: custom.customisations,
              note: jobNote.value.trim(),
            },
          });
          C.toast(C.fmt(C.t("expert.job_created"), {
            ids: created.map(function (job) { return "#" + job.id; }).join(", "),
          }));
          jobOrder.value = "";
          jobCustomer.value = "";
          jobCount.value = "1";
          jobNote.value = "";
          await loadJobCustomisation();
          await refreshJobs();
        } catch (err) {
          reportError(err);
        }
        jobCreateBtn.disabled = false;
      });

      // Called once the password is known to be good (GET /api/expert/settings
      // succeeded); the same call fills the Einstellungen tab, then the Artikel stats load.
      async function enter() {
        await loadSettings();
        showApp();
        await loadItemStats();
        await refreshWorkers();
        await refreshTemplates();
        fillJobFilter();
        await refreshJobTemplates();
        await refreshJobs();
      }

      settingsForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        var minutes = Number(sessionMinutesInput.value);
        if (!Number.isInteger(minutes) || minutes < 1 || minutes > 720) {
          C.toast(C.t("expert.minutes_invalid"));
          return;
        }
        var points = qualityPointsInput.value
          .split("\n")
          .map(function (line) { return line.trim(); })
          .filter(function (line) { return line !== ""; });
        if (new Set(points).size !== points.length) {
          C.toast(C.t("expert.points_duplicate"));
          return;
        }
        try {
          await expertApi("/api/expert/settings", {
            method: "PUT",
            body: {
              second_check_default: secondCheckInput.checked,
              session_minutes: minutes,
              default_quality_points: points,
            },
          });
          await loadSettings();
          C.toast(C.t("expert.saved"));
        } catch (err) {
          reportError(err);
        }
      });

      loginForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        C.setExpertPassword(passwordInput.value);
        passwordInput.value = "";
        try {
          await enter();
        } catch (err) {
          reportError(err);
        }
      });

      tabButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          switchTab(btn.getAttribute("data-tab"));
        });
      });

      async function init() {
        try {
          await C.loadStrings();
        } catch (err) {
          C.toast(C.t("error.generic"));
        }
        // A password kept in sessionStorage survives a reload of the tab.
        if (C.getExpertPassword()) {
          try {
            await enter();
          } catch (err) {
            reportError(err);
          }
        }
      }
      init();
    })();
  </script>
</body>
</html>
